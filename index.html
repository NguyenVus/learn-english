See you soon,
Lan`},
{id:"w-a2-4",type:"Email",title:"Your last weekend",prompt:"Write an email to your English penfriend about last weekend. Say where you went, who you were with and what you did.",vi:"Kể về cuối tuần trước bằng thì quá khứ đơn (went, visited, ate, saw...).",min:40,max:60,k:["last weekend","went","with","was"],model:`Hi Anna,

Last weekend I went to the countryside with my family. We visited my grandparents' farm. On Saturday I fed the chickens and helped my grandmother in the garden. In the evening we ate fresh fish. It was quiet and beautiful. How was your weekend?

Love,
Hoa`},
{id:"w-a2-5",type:"Postcard",title:"A postcard from holiday",prompt:"You are on holiday. Write a postcard to a friend. Describe the place, the weather and one thing you are going to do tomorrow.",vi:"Viết bưu thiếp: mô tả nơi đến, thời tiết và một việc bạn sẽ làm ngày mai (going to).",min:30,max:60,k:["weather","beautiful","tomorrow","going to"],model:`Dear Ben,

Greetings from Nha Trang! The beach is beautiful and the sea is warm. The weather is sunny and hot every day. The food is delicious, especially the seafood. Tomorrow I'm going to take a boat trip to the islands. 

Wish you were here!
Minh`}
];
DATA.writing.B1 = [
{id:"w-b1-1",type:"Informal email",title:"Advice to a friend",prompt:"Your English friend Alex wants to visit your country next summer and asks for advice. Write an email: suggest places to visit, what to bring and the best way to travel around.",vi:"Email thân mật (80–120 từ) đưa lời khuyên: nơi nên đến, nên mang gì, cách di chuyển. Dùng: You should..., Why don't you...?, If I were you...",min:80,max:120,k:["visit","should","bring","travel","train","bus"],model:`Hi Alex,

It's great that you're coming to Vietnam next summer! You should definitely visit Hoi An. The old town is beautiful at night, and the food is amazing. If you have time, Ha Long Bay is also worth seeing.

It'll be very hot, so bring light clothes, sun cream and a hat. Don't forget an umbrella, because it often rains in the afternoon.

The best way to travel around is by train or night bus. They're cheap and comfortable. For short trips in cities, you can use a motorbike taxi app.

Let me know if you need anything else!

Best wishes,
Linh`},
{id:"w-b1-2",type:"Story",title:"A story: The wrong bag",prompt:"Write a short story that begins with this sentence: “When I opened the bag, I realised it wasn't mine.”",vi:"Truyện ngắn (80–120 từ): dùng quá khứ đơn, quá khứ tiếp diễn và quá khứ hoàn thành; có mở đầu, diễn biến, kết thúc.",min:80,max:120,k:["when","was","had","suddenly","finally"],model:`When I opened the bag, I realised it wasn't mine. Instead of my laptop and books, there was a camera, a map of Paris and a small red notebook.

I had picked up the wrong bag at the café that morning while I was talking on the phone. I felt terrible. Suddenly, I noticed a phone number on the first page of the notebook, so I called it.

A young woman answered. She was a French tourist and she had my bag! She was leaving the city that evening, so we met at the station an hour later.

Finally, we swapped bags and laughed about it. We are still friends today.`},
{id:"w-b1-3",type:"Article",title:"Article: My favourite app",prompt:"You see this notice on a school website: “Articles wanted! Which app do you use most and why? How has it changed your life?” Write your article.",vi:"Bài báo ngắn (80–120 từ): có tiêu đề, đoạn mở đầu thu hút, nội dung và kết luận. Có thể đặt câu hỏi cho người đọc.",min:80,max:120,k:["app","because","use","changed","for example"],model:`The App That Changed My Mornings

Do you find it hard to stay organised? I used to, until I started using a simple planning app.

Every evening, I write down my tasks for the next day and the app reminds me at the right time. For example, it tells me when to leave for school and when my homework is due. As a result, I'm never late any more.

The app has also helped me to study better, because I can see how much time I spend on each subject.

If you want to feel less stressed, why not give a planning app a try?`},
{id:"w-b1-4",type:"Informal email",title:"Reply about a school trip",prompt:"Your friend writes: “Our class is going on a trip next month. Should we go to the mountains or to the beach? What do you think?” Reply with your opinion and reasons.",vi:"Trả lời email nêu ý kiến và lý do (80–120 từ). Dùng: I think..., because..., Another reason is..., However...",min:80,max:120,k:["think","because","mountains","beach","however"],model:`Hi Chris,

Thanks for your email! I think the mountains would be a better choice for your class trip.

First of all, there are lots of activities you can do together, like hiking, camping and visiting villages. Another reason is that it's cooler there, so walking won't be too tiring.

However, the beach is a good option if most people just want to relax. It's also easier to get to by bus.

In the end, maybe you could ask everyone to vote. Let me know what your class decides!

Take care,
Mai`},
{id:"w-b1-5",type:"Story",title:"A story: An unexpected visitor",prompt:"Write a short story that ends with this sentence: “It was the best surprise I had ever had.”",vi:"Viết truyện kết thúc bằng câu cho sẵn. Hãy xây dựng tình huống bất ngờ và cảm xúc nhân vật.",min:80,max:120,k:["when","was","knock","door","surprise"],model:`It was a rainy Sunday afternoon and I was feeling bored. My parents were out, and I was watching TV alone.

Suddenly, there was a knock at the door. I wasn't expecting anyone, so I felt a bit nervous. When I opened the door, I couldn't believe my eyes. My older brother was standing there with a huge smile and a suitcase.

He had been studying in Australia for two years, and he hadn't told anyone that he was coming home. We hugged for a long time, and then we made hot chocolate and talked for hours.

It was the best surprise I had ever had.`}
];
DATA.writing.B2 = [
{id:"w-b2-1",type:"Opinion essay",title:"Essay: Technology in the classroom",prompt:"“Technology in classrooms does more harm than good.” To what extent do you agree? Write an opinion essay giving reasons and examples.",vi:"Bài luận quan điểm (140–250 từ): mở bài nêu quan điểm, 2 đoạn thân bài (lý do + ví dụ, có phản biện), kết luận. Dùng từ nối: furthermore, nevertheless, consequently.",min:140,max:250,k:["technology","students","however","furthermore","in conclusion","for example"],model:`Technology has become a familiar part of many classrooms, from interactive whiteboards to tablets. While some argue that it distracts students, I believe that, when used carefully, it does more good than harm.

Firstly, technology gives students access to a huge range of resources. For example, a history class can watch interviews with real witnesses or explore a virtual museum, which makes lessons more engaging. Furthermore, educational apps allow learners to practise at their own pace and receive instant feedback.

Nevertheless, it would be unrealistic to ignore the drawbacks. Students may be tempted to use devices for games or social media, and too much screen time can affect concentration. Consequently, schools need clear rules and teachers must decide when technology genuinely supports learning rather than simply replacing traditional methods.

In conclusion, technology itself is neither good nor bad. Its value depends on how it is used. With thoughtful planning and sensible limits, I am convinced that it can greatly improve the quality of education.`},
{id:"w-b2-2",type:"Formal email",title:"Formal complaint",prompt:"You ordered a laptop online, but it arrived late and the screen was damaged. Write a formal email to the company: describe the problems, explain how this affected you, and say what you would like them to do.",vi:"Email trang trọng phàn nàn: Dear Sir or Madam, I am writing to complain about..., I would be grateful if..., Yours faithfully. Tránh viết tắt (I'm → I am).",min:140,max:200,k:["dear","writing","order","damaged","would","refund","yours"],model:`Dear Sir or Madam,

I am writing to complain about a laptop I ordered from your website on 3rd March (order number 48215).

Firstly, although your website stated that delivery would take two days, the laptop arrived nine days later. As I had bought it specifically for an online course, I was unable to attend the first week of classes.

Secondly, when I opened the box, I discovered that the screen was badly scratched and a section of it did not display anything. I have attached photographs as evidence.

I was extremely disappointed, particularly as your company advertises fast delivery and high-quality checks. I would therefore be grateful if you could arrange for the damaged laptop to be collected and either replace it with a new one or provide a full refund. I would also appreciate some compensation for the delay.

I look forward to receiving your prompt reply.

Yours faithfully,
Nguyen Van An`},
{id:"w-b2-3",type:"Review",title:"Review: a film or series",prompt:"An international magazine wants reviews of a film or series that made you think. Write a review: describe it briefly, say what you liked and disliked, and whether you would recommend it.",vi:"Bài review (140–220 từ): tiêu đề, giới thiệu ngắn (không kể hết cốt truyện), ưu/nhược điểm, khuyến nghị. Dùng tính từ đa dạng: gripping, thought-provoking, predictable.",min:140,max:220,k:["film","series","characters","however","recommend"],model:`A Quiet World: Thought-Provoking but Slow

"A Quiet World" is a science-fiction series set in a future where people communicate only through their devices. The story follows Lena, a young engineer who discovers that the network is secretly controlling people's emotions.

What impressed me most was the acting. The main characters are complex and believable, and Lena's struggle to reconnect with her family is genuinely moving. The visual style is also striking, with cold, empty cities that perfectly reflect the theme of isolation.

However, the series is not without its flaws. The middle episodes are rather slow, and some scenes seem to repeat the same ideas. In addition, the ending felt rushed and left several questions unanswered.

Overall, despite these weaknesses, "A Quiet World" is a thought-provoking series that encourages viewers to reflect on their own relationship with technology. I would recommend it to anyone who enjoys intelligent drama, as long as they are prepared to be patient.`},
{id:"w-b2-4",type:"Report",title:"Report: improving the school library",prompt:"Your principal has asked for a report on how the school library could be improved. Describe how students use it now, the main problems, and your recommendations.",vi:"Báo cáo (160–250 từ): có tiêu đề và các mục (Introduction, Current situation, Problems, Recommendations). Văn phong trang trọng, dùng câu bị động.",min:160,max:250,k:["introduction","students","problems","recommend","library","conclusion"],model:`Report on Improving the School Library

Introduction
The aim of this report is to describe how the library is currently used and to suggest ways in which it could be improved. The information is based on a survey of 120 students.

Current situation
At present, the library is mainly used for quiet study during lunchtime. Only about a third of students said they borrow books regularly.

Problems
Two main problems were identified. Firstly, many books are out of date, especially in the science section. Secondly, there are not enough computers, so students often have to wait to complete online research. Several students also mentioned that the library closes too early.

Recommendations
It is recommended that part of next year's budget be spent on modern books and e-books. In addition, at least ten more computers should be installed. Finally, extending the opening hours until 6 p.m. would allow students to study after school.

Conclusion
If these changes are made, the library is likely to become a more popular and useful place for all students.`},
{id:"w-b2-5",type:"Informal email",title:"Advice email: choosing a university",prompt:"Your cousin can't decide whether to study at a university in your city or abroad. Write an informal email giving advice, comparing the two options and explaining what you would do in their position.",vi:"Email thân mật B2: so sánh hai lựa chọn, dùng câu điều kiện (If I were you...), cấu trúc wish, và từ nối đa dạng.",min:140,max:220,k:["abroad","if i were you","by contrast","on the other hand","wish"],model:`Hi Duc,

Thanks for your message – I can see why you're finding this decision so hard!

Studying here definitely has its advantages. You'd be close to the family, your living costs would be much lower, and you could keep your part-time job. On the other hand, you might miss the chance to become more independent.

Studying abroad, by contrast, would push you out of your comfort zone. Your English would improve enormously, and you'd make friends from all over the world. That said, it's expensive, and the first few months can be really lonely. I still wish I had spent a semester abroad when I had the chance.

If I were you, I'd look into exchange programmes. That way, you could start here and spend a year overseas later, which would give you the best of both worlds.

Whatever you decide, I'm sure you'll make the most of it. Let me know how it goes!

Lots of love,
Thu`}
];

DATA.grammar.A2 = [
{id:"g-a2-1",title:"Present simple and present continuous",
ex:`<p><b>Present simple</b> = habits, routines, facts: <i>I <b>work</b> in a bank. She <b>gets up</b> at 7.</i> Add <b>-s/-es</b> with he/she/it. Negative: <i>don't / doesn't + verb</i>.</p><p><b>Present continuous</b> = actions happening now or around now: <i>I <b>am reading</b>. They <b>are staying</b> with friends this week.</i> Form: <i>am/is/are + verb-ing</i>.</p><p>Signal words: <i>always, usually, every day</i> → simple; <i>now, at the moment, today, Look!</i> → continuous. State verbs (<i>like, know, want, need</i>) are usually not continuous.</p>`,
vi:"Hiện tại đơn: thói quen, sự thật (nhớ thêm -s/-es với he/she/it). Hiện tại tiếp diễn: việc đang diễn ra lúc nói (am/is/are + V-ing). Động từ chỉ trạng thái như like, know, want không chia tiếp diễn: nói “I know”, không nói “I am knowing”.",
eg:["My brother plays football every Sunday.","Look! It's raining.","She doesn't eat meat.","What are you doing at the moment?"],
q:[
{t:"mc",q:"My sister ___ in a hospital.",o:["work","works","is work"],a:1},
{t:"mc",q:"Be quiet! The baby ___.",o:["sleeps","is sleeping","sleep"],a:1},
{t:"gap",q:"He ___ (not / like) coffee.",a:["doesn't like","does not like"]},
{t:"mc",q:"I ___ the answer.",o:["know","am knowing","knows"],a:0,x:"“know” is a state verb, so we use the present simple."},
{t:"gap",q:"Look! They ___ (play) in the garden.",a:["are playing","'re playing"]},
{t:"mc",q:"We usually ___ dinner at 7 p.m.",o:["are having","have","has"],a:1},
{t:"mc",q:"___ she speak Japanese?",o:["Do","Does","Is"],a:1},
{t:"gap",q:"This week I ___ (stay) with my aunt.",a:["am staying","'m staying"]},
{t:"mc",q:"Water ___ at 100°C.",o:["boils","is boiling","boil"],a:0},
{t:"mc",q:"What ___ you doing now?",o:["do","are","is"],a:1}
]},
{id:"g-a2-2",title:"Past simple",
ex:`<p>Use the <b>past simple</b> for finished actions in the past: <i>I <b>visited</b> Hue last year.</i></p><p>Regular verbs add <b>-ed</b>: <i>play → played, study → studied, stop → stopped</i>. Many common verbs are irregular: <i>go → went, have → had, see → saw, buy → bought, eat → ate</i>.</p><p>Negative and questions use <b>did</b> + base verb: <i>I <b>didn't go</b>. <b>Did</b> you <b>see</b> it?</i> (not <s>didn't went</s>). Be: <i>was / were</i>.</p><p>Signal words: <i>yesterday, last week, ago, in 2020</i>.</p>`,
vi:"Quá khứ đơn diễn tả hành động đã kết thúc. Động từ có quy tắc thêm -ed; bất quy tắc phải học thuộc (go → went). Sau did/didn't dùng động từ nguyên mẫu: “I didn't go”, không phải “I didn't went”.",
eg:["We watched a film last night.","She went to Da Nang two years ago.","Did you finish your homework?","I wasn't at home yesterday."],
q:[
{t:"gap",q:"Yesterday I ___ (go) to the cinema.",a:"went"},
{t:"mc",q:"She ___ her keys last night.",o:["lose","losed","lost"],a:2},
{t:"mc",q:"We didn't ___ the bus.",o:["catch","caught","catched"],a:0},
{t:"gap",q:"___ you enjoy the party?",a:"did"},
{t:"mc",q:"They ___ at home last Sunday.",o:["was","were","did"],a:1},
{t:"gap",q:"He ___ (study) English for two hours.",a:"studied"},
{t:"mc",q:"I ___ a new phone last month.",o:["buy","bought","buyed"],a:1},
{t:"mc",q:"Where ___ you go on holiday?",o:["did","do","were"],a:0},
{t:"gap",q:"The train ___ (stop) at every station.",a:"stopped"},
{t:"mc",q:"Choose the correct sentence.",o:["I didn't saw him.","I didn't see him.","I not saw him."],a:1}
]},
{id:"g-a2-3",title:"Future: will and going to",
ex:`<p><b>Going to</b> = plans and intentions decided before speaking: <i>I'm <b>going to</b> visit my grandparents next week.</i> Also predictions based on what we can see: <i>Look at those clouds! It's <b>going to</b> rain.</i></p><p><b>Will</b> = decisions made at the moment of speaking, offers, promises and general predictions: <i>I'm thirsty. – I'll get you some water. I think it <b>will</b> be sunny tomorrow.</i></p><p>Negative: <i>won't (= will not)</i>, <i>I'm not going to…</i></p>`,
vi:"“Going to” cho kế hoạch đã định trước hoặc dự đoán có dấu hiệu rõ. “Will” cho quyết định ngay lúc nói, lời hứa, đề nghị giúp đỡ, dự đoán chung (I think... will...).",
eg:["We're going to move house in May.","The phone's ringing. – I'll answer it.","I promise I won't be late.","I think robots will do many jobs in the future."],
q:[
{t:"mc",q:"I've decided. I ___ study medicine.",o:["will","am going to","going to"],a:1},
{t:"mc",q:"A: It's cold in here. B: I ___ close the window.",o:["'ll","'m going to","am"],a:0},
{t:"mc",q:"Look at that car! It ___ crash!",o:["will","is going to","goes to"],a:1},
{t:"gap",q:"I promise I ___ (not) tell anyone.",a:["won't","will not"]},
{t:"mc",q:"I think she ___ win the competition.",o:["will","is going","going to"],a:0},
{t:"gap",q:"We ___ (travel) to Hanoi next weekend – we've bought the tickets.",a:["are going to travel","'re going to travel"]},
{t:"mc",q:"___ you help me with this bag, please?",o:["Will","Are","Going to"],a:0},
{t:"mc",q:"What ___ do after school today?",o:["will you going to","are you going to","you will"],a:1},
{t:"gap",q:"Don't worry. I ___ (call) you when I arrive.",a:["will call","'ll call"]},
{t:"mc",q:"Choose the correct sentence.",o:["I going to buy a car.","I'm going to buy a car.","I'm going buy a car."],a:1}
]},
{id:"g-a2-4",title:"Comparatives and superlatives",
ex:`<p><b>Short adjectives</b>: add <b>-er / -est</b>: <i>cheap → cheaper → the cheapest; big → bigger → the biggest; easy → easier → the easiest</i>.</p><p><b>Long adjectives</b>: <i>more / the most</i>: <i>expensive → more expensive → the most expensive</i>.</p><p>Irregular: <i>good → better → the best; bad → worse → the worst; far → further → the furthest</i>.</p><p>Use <b>than</b> with comparatives: <i>Hanoi is bigger <b>than</b> Hue.</i> Use <b>the</b> with superlatives. <i>as … as</i> = equal: <i>She is as tall as me.</i></p>`,
vi:"So sánh hơn: tính từ ngắn + -er + than; tính từ dài: more + adj + than. So sánh nhất: the + -est / the most. Không dùng “more better” – chỉ nói “better”.",
eg:["My bag is heavier than yours.","This is the most beautiful beach in the area.","Today is worse than yesterday.","He isn't as fast as his brother."],
q:[
{t:"gap",q:"A plane is ___ (fast) than a train.",a:"faster"},
{t:"mc",q:"This hotel is ___ than the other one.",o:["more cheap","cheaper","cheapest"],a:1},
{t:"mc",q:"She is the ___ student in our class.",o:["most intelligent","more intelligent","intelligentest"],a:0},
{t:"gap",q:"My cooking is bad, but yours is ___!",a:"worse"},
{t:"mc",q:"It's the ___ day of the year.",o:["hotter","hottest","most hot"],a:1},
{t:"mc",q:"Choose the correct sentence.",o:["My phone is more better than yours.","My phone is better than yours.","My phone is gooder than yours."],a:1},
{t:"gap",q:"English is ___ (easy) than Chinese for me.",a:"easier"},
{t:"mc",q:"Tom is as tall ___ his father.",o:["than","as","like"],a:1},
{t:"mc",q:"Which is the ___ city in the world?",o:["bigest","biggest","most big"],a:1},
{t:"gap",q:"This film is ___ (interesting) than the book.",a:"more interesting"}
]},
{id:"g-a2-5",title:"Countable and uncountable nouns",
ex:`<p><b>Countable</b> nouns have singular and plural: <i>an apple, two apples</i>. <b>Uncountable</b> nouns have no plural and no <i>a/an</i>: <i>water, rice, money, information, advice, homework, furniture</i>.</p><p><i>some</i> (positive) / <i>any</i> (negatives and questions) – with both types. <i>many / a few</i> + countable; <i>much / a little</i> + uncountable; <i>a lot of</i> + both.</p><p><i>How many apples? How much milk?</i> Use units for uncountable: <i>a bottle of water, a piece of advice, a cup of tea</i>.</p>`,
vi:"Danh từ không đếm được (water, rice, information, advice, homework...) không có số nhiều và không đi với a/an. many/a few + đếm được; much/a little + không đếm được. Lỗi hay gặp: “informations”, “an advice”.",
eg:["There are some eggs in the fridge.","We don't have much time.","Can I give you a piece of advice?","How many people came?"],
q:[
{t:"mc",q:"How ___ sugar do you want?",o:["many","much","a few"],a:1},
{t:"mc",q:"There aren't ___ chairs in the room.",o:["any","much","a little"],a:0},
{t:"mc",q:"Can you give me some ___?",o:["advices","advice","an advice"],a:1},
{t:"gap",q:"How ___ students are in your class?",a:"many"},
{t:"mc",q:"I need ___ information about the course.",o:["an","some","many"],a:1},
{t:"mc",q:"I have ___ friends in Da Nang.",o:["a few","a little","much"],a:0},
{t:"gap",q:"Would you like a ___ of tea?",a:"cup"},
{t:"mc",q:"We have ___ homework today.",o:["many","a lot of","a"],a:1},
{t:"mc",q:"Choose the correct sentence.",o:["The furnitures are new.","The furniture is new.","A furniture is new."],a:1},
{t:"gap",q:"There's only a ___ milk left. Let's buy some more.",a:"little"}
]},
{id:"g-a2-6",title:"can, must, have to",
ex:`<p><b>can / can't</b> = ability or permission: <i>I <b>can</b> swim. <b>Can</b> I open the window?</i></p><p><b>must</b> = strong obligation, often from the speaker or rules: <i>You <b>must</b> wear a seatbelt.</i> <b>mustn't</b> = it is not allowed: <i>You <b>mustn't</b> smoke here.</i></p><p><b>have to</b> = obligation from outside (rules, situation): <i>I <b>have to</b> wear a uniform at school.</i> <b>don't have to</b> = it is not necessary: <i>You <b>don't have to</b> come – it's optional.</i></p><p>After modal verbs use the base verb without <i>to</i>: <s>can to swim</s> → <i>can swim</i>.</p>`,
vi:"can: khả năng/xin phép. must: bắt buộc (mạnh). mustn't: cấm. have to: bắt buộc do hoàn cảnh/quy định. don't have to: không cần thiết (KHÁC với mustn't). Sau can/must không có “to”.",
eg:["She can speak three languages.","You mustn't use your phone in the exam.","We have to get up early tomorrow.","You don't have to pay. It's free."],
q:[
{t:"mc",q:"You ___ touch that. It's dangerous!",o:["mustn't","don't have to","can"],a:0},
{t:"mc",q:"It's Sunday, so I ___ go to work.",o:["mustn't","don't have to","can't to"],a:1},
{t:"mc",q:"___ I use your pen, please?",o:["Must","Can","Have"],a:1},
{t:"gap",q:"Students ___ wear a uniform. It's a school rule. (have)",a:["have to","must"]},

{id:"g-a2-7",title:"Prepositions of time and place",
ex:`<p><b>Time</b>: <b>at</b> + clock times and short expressions (<i>at 7 o'clock, at night, at the weekend</i>); <b>on</b> + days and dates (<i>on Monday, on 5th May, on my birthday</i>); <b>in</b> + months, years, seasons, parts of the day (<i>in July, in 2025, in summer, in the morning</i>).</p><p><b>Place</b>: <b>in</b> = inside an area (<i>in the kitchen, in Hanoi</i>); <b>on</b> = on a surface or line (<i>on the table, on the wall, on the second floor</i>); <b>at</b> = a point or place for an activity (<i>at the bus stop, at school, at home</i>). Also: <i>next to, between, opposite, behind, under, in front of</i>.</p>`,
vi:"Thời gian: at + giờ; on + ngày/thứ; in + tháng/năm/mùa/buổi. Nơi chốn: in (bên trong), on (trên bề mặt, tầng), at (một điểm cụ thể: at school, at home).",
eg:["The meeting is at 3 p.m. on Friday.","I was born in 2008.","Your keys are on the table.","Meet me at the station."],
q:[

]}

<script>

DATA.grammar.B1 = [
{id:"g-b1-1",title:"Present perfect vs past simple",
ex:`<p><b>Present perfect</b> (<i>have/has + past participle</i>) connects the past with now: experiences (<i>I've <b>been</b> to Japan.</i>), unfinished time (<i>I've <b>lived</b> here <b>for</b> five years / <b>since</b> 2020.</i>), recent results (<i>I've <b>lost</b> my keys.</i>). Common words: <i>ever, never, already, yet, just, for, since</i>.</p><p><b>Past simple</b> = finished time, often with a time expression: <i>I <b>went</b> to Japan <b>in 2019</b>.</i> Don't use the present perfect with <i>yesterday, last year, ago</i>.</p><p><b>for</b> + a period (<i>for three weeks</i>); <b>since</b> + a starting point (<i>since Monday</i>).</p>`,
vi:"Hiện tại hoàn thành: kinh nghiệm, việc kéo dài đến nay, kết quả còn liên quan hiện tại. Quá khứ đơn: thời điểm đã kết thúc rõ ràng (yesterday, last year, ago). for + khoảng thời gian; since + mốc thời gian. Lỗi hay gặp: “I have seen him yesterday”.",
eg:["Have you ever eaten durian?","She has worked here since 2021.","I saw that film last week.","We haven't finished yet."],
q:[
{t:"mc",q:"I ___ to London three times.",o:["have been","went","was"],a:0},
{t:"mc",q:"She ___ her phone yesterday.",o:["has lost","lost","have lost"],a:1},
{t:"gap",q:"We've known each other ___ 2015.",a:"since"},
{t:"gap",q:"They have lived in this house ___ ten years.",a:"for"},
{t:"mc",q:"___ you ever tried sushi?",o:["Did","Have","Were"],a:1},
{t:"mc",q:"I ___ him two days ago.",o:["have met","met","meet"],a:1},
{t:"gap",q:"Have you finished your homework ___? (question about now)",a:"yet"},
{t:"mc",q:"He has ___ arrived. He's taking off his coat.",o:["just","yet","ever"],a:0},
{t:"mc",q:"Choose the correct sentence.",o:["I have seen her last night.","I saw her last night.","I have saw her last night."],a:1},
{t:"gap",q:"How long ___ you worked here? (present perfect)",a:"have"}
]},
{id:"g-b1-2",title:"Past continuous",
ex:`<p>Form: <i>was/were + verb-ing</i>. Use it for an action <b>in progress</b> at a time in the past: <i>At 8 p.m. I <b>was watching</b> TV.</i></p><p>Often used with the past simple: the long action (continuous) is interrupted by a short action (simple): <i>I <b>was walking</b> home <b>when</b> it <b>started</b> to rain.</i> <i>While</i> + continuous: <i><b>While</b> she <b>was cooking</b>, the phone rang.</i></p><p>Two actions at the same time: <i>He was reading while I was studying.</i></p>`,
vi:"Quá khứ tiếp diễn (was/were + V-ing): hành động đang diễn ra tại một thời điểm trong quá khứ. Kết hợp với quá khứ đơn: hành động dài (tiếp diễn) bị hành động ngắn (quá khứ đơn) chen vào. when + quá khứ đơn, while + quá khứ tiếp diễn.",
eg:["I was sleeping when you called.","What were you doing at 10 o'clock?","While we were waiting, it started to snow.","They weren't listening to the teacher."],
q:[
{t:"mc",q:"I ___ a shower when the doorbell rang.",o:["had","was having","have"],a:1},
{t:"mc",q:"While she was driving, she ___ an accident.",o:["saw","was seeing","sees"],a:0},
{t:"gap",q:"At 9 p.m. yesterday, we ___ (watch) a film.",a:"were watching"},
{t:"mc",q:"What ___ you doing at midnight?",o:["did","were","was"],a:1},
{t:"gap",q:"He fell off his bike while he ___ (ride) to school.",a:"was riding"},
{t:"mc",q:"The children ___ when the teacher came in.",o:["were shouting","shouted","shouts"],a:0},
{t:"mc",q:"It ___ when we left the house.",o:["was raining","rained","is raining"],a:0},
{t:"gap",q:"I ___ (not / listen), so I didn't hear the question.",a:["wasn't listening","was not listening"]},
{t:"mc",q:"___ she was cooking, he set the table.",o:["When","While","During"],a:1},
{t:"mc",q:"I broke my leg when I ___.",o:["was skiing","skiing","was ski"],a:0}
]},
{id:"g-b1-3",title:"First and second conditionals",
ex:`<p><b>First conditional</b> = real or likely future situations: <i>If + present simple, will + verb</i>. <i>If it <b>rains</b>, we <b>will stay</b> at home.</i></p><p><b>Second conditional</b> = unreal, imaginary or unlikely situations (now/future): <i>If + past simple, would + verb</i>. <i>If I <b>had</b> more money, I <b>would travel</b> around the world.</i> With <i>be</i>, we often use <i>were</i> for all persons: <i>If I <b>were</b> you, I'd apologise.</i></p><p><i>unless</i> = if … not: <i>You'll miss the bus unless you hurry.</i></p>`,
vi:"Điều kiện loại 1 (có thể xảy ra): If + hiện tại đơn, will + V. Loại 2 (không có thật ở hiện tại/khó xảy ra): If + quá khứ đơn, would + V. Không dùng “will” sau “if” trong mệnh đề điều kiện: “If it will rain” là sai.",
eg:["If you study hard, you'll pass.","If I won the lottery, I'd buy a house.","If I were you, I'd take the job.","Unless you leave now, you'll be late."],
q:[
{t:"mc",q:"If it ___ tomorrow, we'll go to the beach.",o:["will be sunny","is sunny","was sunny"],a:1},
{t:"mc",q:"If I had a car, I ___ you to the airport.",o:["will drive","would drive","drive"],a:1},
{t:"gap",q:"If I ___ (be) you, I would talk to her.",a:"were"},
{t:"mc",q:"You'll be tired ___ you go to bed early.",o:["if","unless","when"],a:1},
{t:"gap",q:"If she ___ (miss) the bus, she will walk.",a:"misses"},
{t:"mc",q:"What would you do if you ___ a famous person?",o:["meet","met","will meet"],a:1},
{t:"mc",q:"If we don't hurry, we ___ the train.",o:["would miss","will miss","missed"],a:1},
{t:"gap",q:"If I knew the answer, I ___ (tell) you.",a:["would tell","'d tell"]},
{t:"mc",q:"Choose the correct sentence.",o:["If it will rain, I will stay home.","If it rains, I will stay home.","If it rains, I would stay home."],a:1},
{t:"mc",q:"If he ___ more, he would be healthier.",o:["exercises","exercised","will exercise"],a:1}
]},
{id:"g-b1-4",title:"Passive voice (basic)",
ex:`<p>Use the <b>passive</b> when the action is more important than who does it, or when we don't know who does it. Form: <i>be + past participle</i>.</p><p>Present simple: <i>English <b>is spoken</b> in many countries.</i> Past simple: <i>The bridge <b>was built</b> in 1902.</i> Present perfect: <i>My bike <b>has been stolen</b>!</i> Future: <i>The results <b>will be announced</b> tomorrow.</i></p><p>Use <b>by</b> to say who did it (only if important): <i>The book was written <b>by</b> a teacher.</i></p>`,
vi:"Câu bị động: be + V3/ed. Dùng khi hành động quan trọng hơn người làm. Chia “be” theo thì: is/are (hiện tại), was/were (quá khứ), has been (hiện tại hoàn thành), will be (tương lai). by + người thực hiện (nếu cần).",
eg:["Coffee is grown in the Central Highlands.","The window was broken last night.","The match has been cancelled.","The new school will be opened next year."],
q:[
{t:"mc",q:"Rice ___ in many Asian countries.",o:["grows","is grown","is grow"],a:1},
{t:"gap",q:"This house ___ (build) in 1990.",a:"was built"},
{t:"mc",q:"The letters ___ every morning.",o:["are delivered","deliver","are deliver"],a:0},
{t:"mc",q:"My wallet ___! I can't find it anywhere.",o:["has stolen","has been stolen","was steal"],a:1},
{t:"gap",q:"The winners will ___ (announce) tomorrow.",a:"be announced"},
{t:"mc",q:"“Romeo and Juliet” was written ___ Shakespeare.",o:["from","by","with"],a:1},
{t:"mc",q:"Choose the passive: “Someone cleans the office every day.”",o:["The office cleans every day.","The office is cleaned every day.","The office was cleaned every day."],a:1},
{t:"gap",q:"The museum ___ (visit) by thousands of people every year.",a:"is visited"},
{t:"mc",q:"The meeting ___ because the manager was ill.",o:["was cancelled","cancelled","is cancel"],a:0},
{t:"mc",q:"Smartphones ___ in factories all over the world.",o:["make","are made","are making"],a:1}
]},
{id:"g-b1-5",title:"Relative clauses",
ex:`<p>Relative clauses give more information about a noun. <b>who</b> = people, <b>which</b> = things, <b>that</b> = people or things (defining clauses), <b>where</b> = places, <b>whose</b> = possession.</p><p><b>Defining</b> (necessary information, no commas): <i>The woman <b>who lives next door</b> is a doctor.</i></p><p><b>Non-defining</b> (extra information, with commas, no <i>that</i>): <i>My brother, <b>who lives in Hue</b>, is a teacher.</i></p><p>You can leave out <i>who/which/that</i> when it is the object: <i>The book (that) I bought is great.</i></p>`,
vi:"Mệnh đề quan hệ: who (người), which (vật), that (người/vật, chỉ trong mệnh đề xác định), where (nơi chốn), whose (sở hữu). Mệnh đề không xác định có dấu phẩy và không dùng “that”.",
eg:["That's the man who helped me.","The phone which I bought last week is broken.","This is the café where we first met.","I have a friend whose father is a pilot."],
q:[
{t:"mc",q:"The girl ___ won the prize is my cousin.",o:["which","who","where"],a:1},
{t:"mc",q:"This is the town ___ I grew up.",o:["which","where","who"],a:1},
{t:"gap",q:"The laptop ___ I bought is very fast. (thing)",a:["which","that"]},
{t:"mc",q:"I know a man ___ dog can open doors.",o:["who","whose","which"],a:1},
{t:"mc",q:"My mother, ___ is 50, still runs every day.",o:["that","who","which"],a:1},
{t:"gap",q:"Do you remember the restaurant ___ we had dinner last year?",a:"where"},
{t:"mc",q:"The film ___ we watched was boring.",o:["who","what","that"],a:2},
{t:"mc",q:"Choose the correct sentence.",o:["Hanoi, that is the capital, is busy.","Hanoi, which is the capital, is busy.","Hanoi, where is the capital, is busy."],a:1},
{t:"gap",q:"A teacher is a person ___ helps students learn.",a:["who","that"]},
{t:"mc",q:"That's the student ___ essay won the competition.",o:["who","whose","which"],a:1}
]},
{id:"g-b1-6",title:"used to",
ex:`<p><b>used to + verb</b> = past habits or states that are not true now: <i>I <b>used to</b> play the piano, but I stopped.</i> <i>There <b>used to</b> be a cinema here.</i></p><p>Negative: <i>didn't use to</i>. Question: <i>Did you use to…?</i> (no <i>-d</i> after did).</p><p>Don't confuse with <b>be used to + -ing</b> = be familiar with: <i>I'm used to getting up early.</i></p>`,
vi:"used to + V: thói quen/trạng thái trong quá khứ nay không còn. Phủ định/nghi vấn: didn't use to / Did you use to (không có -d). Khác với “be used to + V-ing” (đã quen với).",
eg:["I used to live in the countryside.","She didn't use to like vegetables.","Did you use to walk to school?","He's used to working at night."],
q:[
{t:"mc",q:"I ___ play football every day when I was a child.",o:["use to","used to","was used to"],a:1},
{t:"gap",q:"There ___ be a park here, but now it's a car park. (two words)",a:"used to"},
{t:"mc",q:"Did you ___ have long hair?",o:["used to","use to","using to"],a:1},
{t:"mc",q:"She didn't ___ drink coffee.",o:["use to","used to","uses to"],a:0},
{t:"mc",q:"I'm used to ___ in a big city now.",o:["live","living","lived"],a:1},
{t:"gap",q:"My grandparents ___ (use to) write letters instead of emails.",a:"used to"},
{t:"mc",q:"Which sentence talks about a past habit?",o:["I used to swim every morning.","I'm used to swimming.","I use to swim."],a:0},
{t:"mc",q:"He ___ be shy, but now he's very confident.",o:["used to","is used to","use"],a:0},
{t:"gap",q:"We ___ (not) use to have a TV.",a:["didn't","did not"]},
{t:"mc",q:"Choose the correct question.",o:["Did you used to play games?","Did you use to play games?","Used you to play games?"],a:1}
]},
{id:"g-b1-7",title:"Gerunds and infinitives (basic)",
ex:`<p>Some verbs are followed by <b>-ing</b> (gerund): <i>enjoy, finish, mind, avoid, suggest, keep, practise</i>: <i>I enjoy <b>reading</b>.</i></p><p>Some verbs are followed by <b>to + verb</b> (infinitive): <i>want, decide, hope, plan, agree, promise, need, would like</i>: <i>She decided <b>to leave</b>.</i></p><p>After prepositions use <b>-ing</b>: <i>I'm good at <b>drawing</b>. Thanks for <b>helping</b>.</i> As a subject, use -ing: <i><b>Swimming</b> is good exercise.</i> After adjectives, often to + verb: <i>It's easy <b>to learn</b>.</i></p>`,
vi:"Động từ + V-ing: enjoy, finish, mind, avoid, suggest, keep. Động từ + to V: want, decide, hope, plan, agree, promise, need. Sau giới từ luôn dùng V-ing: interested in learning, good at cooking.",
eg:["I've finished doing my homework.","We hope to see you soon.","She's interested in learning Korean.","It's important to drink enough water."],
q:[

{t:"gap",q:"Would you mind ___ (open) the window?",a:"opening"},
{t:"mc",q:"I hope ___ you again soon.",o:["seeing","to see","see"],a:1},
{t:"mc",q:"___ too much sugar is bad for you.",o:["Eat","To eating","Eating"],a:2},
{t:"gap",q:"We agreed ___ (meet) at six.",a:"to meet"},
{t:"mc",q:"Thanks for ___ me!",o:["help","to help","helping"],a:2}
]}
];

<script>
/* ===================== GRAMMAR · B2 ===================== */
DATA.grammar.B2 = [
{id:"g-b2-1",title:"Review of all tenses",
ex:`<p><b>Simple</b> forms describe complete actions or facts; <b>continuous</b> forms describe actions in progress; <b>perfect</b> forms look back from a point in time.</p><ul><li>Present perfect continuous: duration up to now – <i>I've <b>been waiting</b> for an hour.</i></li><li>Past perfect: an action before another past action – <i>When I arrived, the film <b>had</b> already <b>started</b>.</i></li><li>Past perfect continuous: duration before a past moment – <i>She was tired because she <b>had been working</b> all day.</i></li><li>Future continuous: in progress at a future time – <i>This time tomorrow I'<b>ll be flying</b> to Paris.</i></li><li>Future perfect: completed before a future time – <i>By 2030, I <b>will have finished</b> my degree.</i></li></ul>`,
vi:"Ôn tập 12 thì: chú ý thì hoàn thành tiếp diễn (nhấn mạnh quá trình), quá khứ hoàn thành (việc xảy ra trước một việc khác trong quá khứ), tương lai tiếp diễn và tương lai hoàn thành (by + mốc thời gian).",
eg:["I've been learning English since I was ten.","By the time we got there, everyone had left.","Don't call at eight – I'll be having dinner.","She will have retired by next summer."],
q:[
{t:"mc",q:"I ___ for this company for six years now.",o:["work","have been working","had worked"],a:1},
{t:"mc",q:"When I got to the station, the train ___.",o:["already left","had already left","has already left"],a:1},
{t:"gap",q:"By next June, I ___ (finish) my course. (future perfect)",a:["will have finished","'ll have finished"]},
{t:"mc",q:"This time next week, we ___ on the beach.",o:["will lie","will be lying","are lying"],a:1},
{t:"mc",q:"Her eyes were red because she ___.",o:["cried","had been crying","has cried"],a:1},

{t:"mc",q:"I ___ to the gym three times this week.",o:["have been","went","had been"],a:0},
{t:"mc",q:"While I ___ the report, my computer crashed.",o:["wrote","was writing","had written"],a:1},
{t:"gap",q:"How long ___ you been studying? (present perfect continuous)",a:"have"},
{t:"mc",q:"She ___ never ___ a plane before her trip last year.",o:["has / taken","had / taken","did / take"],a:1}

{id:"g-b2-2",title:"Third and mixed conditionals",
ex:`<p><b>Third conditional</b> = imaginary past (it didn't happen): <i>If + past perfect, would have + past participle</i>. <i>If I <b>had studied</b>, I <b>would have passed</b>.</i></p><p><b>Mixed conditional</b> (past → present): <i>If + past perfect, would + verb</i>. <i>If I <b>had taken</b> that job, I <b>would be</b> rich now.</i></p><p>(present → past): <i>If + past simple, would have + past participle</i>. <i>If I <b>were</b> more organised, I <b>wouldn't have missed</b> the deadline.</i></p><p>Variations: <i>could have / might have</i>; inversion in formal style: <i><b>Had</b> I known, I would have helped.</i></p>`,
vi:"Điều kiện loại 3: giả định trái với quá khứ (If + had V3, would have V3). Hỗn hợp: điều kiện quá khứ – kết quả hiện tại (If + had V3, would + V) hoặc ngược lại. Đảo ngữ trang trọng: Had I known...",
eg:["If we had left earlier, we wouldn't have missed the flight.","If she hadn't helped me, I'd still be lost.","If I spoke French, I would have understood the film.","Had I known, I would have called you."],
q:[
{t:"mc",q:"If I ___ about the party, I would have come.",o:["knew","had known","have known"],a:1},
{t:"gap",q:"If you had asked me, I ___ (help) you. (third conditional)",a:["would have helped","'d have helped"]},
{t:"mc",q:"If he had saved money, he ___ a car now.",o:["would have","would have had","will have"],a:0,x:"Mixed conditional: past condition, present result."},
{t:"mc",q:"If I weren't afraid of flying, I ___ to Australia last year.",o:["would go","would have gone","had gone"],a:1},
{t:"mc",q:"___ I known the truth, I would have acted differently.",o:["If","Had","Have"],a:1},
{t:"gap",q:"If it ___ (not / rain), we would have played the match.",a:["hadn't rained","had not rained"]},
{t:"mc",q:"She might have won if she ___ harder.",o:["trained","had trained","would train"],a:1},
{t:"mc",q:"If I had gone to bed earlier, I ___ so tired now.",o:["wouldn't be","wouldn't have been","won't be"],a:0},
{t:"gap",q:"We ___ (could / catch) the train if we had run. (could + have + V3)",a:"could have caught"},
{t:"mc",q:"Choose the correct sentence.",o:["If I would have known, I would have told you.","If I had known, I would have told you.","If I knew, I would have told you yesterday."],a:1}
]},
{id:"g-b2-3",title:"Advanced passive",
ex:`<p><b>Passive with modals</b>: <i>The work <b>must be finished</b> by Friday. It <b>should have been done</b> earlier.</i></p><p><b>Impersonal passive</b> (formal reporting): <i><b>It is said that</b> the castle is haunted.</i> / <i>The castle <b>is said to be</b> haunted.</i> Also: <i>It is believed / thought / reported / expected that…</i>; past reference: <i>He <b>is thought to have left</b> the country.</i></p><p><b>Causative</b>: <i>have/get something done</i> = arrange for someone to do it: <i>I <b>had my hair cut</b>. We're <b>getting the car repaired</b>.</i></p><p>Passive -ing and infinitive: <i>I hate <b>being interrupted</b>. She wants <b>to be promoted</b>.</i></p>`,
vi:"Bị động nâng cao: với động từ khuyết thiếu (must be done, should have been done), bị động khách quan (It is said that... / He is said to be...), thể sai khiến (have/get something done), bị động với V-ing và to V.",
eg:["The building is believed to be 500 years old.","It has been reported that prices will rise.","I'm having my laptop fixed tomorrow.","He doesn't like being told what to do."],
q:[
{t:"mc",q:"The report ___ by tomorrow.",o:["must finish","must be finished","must finished"],a:1},
{t:"mc",q:"It ___ that the minister will resign.",o:["is expected","expects","is expecting"],a:0},
{t:"gap",q:"The thief is believed ___ (escape) through the window. (perfect infinitive)",a:"to have escaped"},
{t:"mc",q:"I ___ my eyes tested last week.",o:["had","made","did"],a:0},
{t:"mc",q:"She hates ___ in public.",o:["criticising","being criticised","be criticised"],a:1},

{id:"g-b2-4",title:"Reported speech",
ex:`<p>When the reporting verb is in the past, tenses usually move back: <i>“I <b>am</b> tired.” → She said (that) she <b>was</b> tired.</i> present simple → past simple; present continuous → past continuous; present perfect / past simple → past perfect; will → would; can → could.</p><p>Time and place words change: <i>now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there</i>.</p><p>Questions: <i>“Where do you live?” → He asked me <b>where I lived</b>.</i> (normal word order); yes/no: <i>He asked <b>if/whether</b> I was ready.</i> Commands: <i>She told me <b>to sit down</b> / <b>not to worry</b>.</i> Other verbs: <i>suggest, advise, warn, deny, admit, promise</i>.</p>`,
vi:"Câu tường thuật: lùi thì (am → was, will → would, have done → had done), đổi trạng từ thời gian/nơi chốn. Câu hỏi tường thuật không đảo ngữ: He asked where I lived. Mệnh lệnh: tell/ask + someone + (not) to V.",
eg:["He said he would call me the next day.","She asked whether I had finished.","The doctor advised me to rest.","He admitted breaking the window."],
q:[
{t:"mc",q:"“I'm busy.” → She said she ___ busy.",o:["is","was","has been"],a:1},
{t:"mc",q:"“I'll help you.” → He said he ___ help me.",o:["will","would","can"],a:1},
{t:"gap",q:"“Where do you work?” → She asked me where I ___.",a:"worked"},
{t:"mc",q:"“Don't be late.” → He told us ___ late.",o:["not be","not to be","don't be"],a:1},
{t:"mc",q:"“I saw him yesterday.” → She said she had seen him ___.",o:["yesterday","the day before","tomorrow"],a:1},
{t:"gap",q:"“Are you ready?” → He asked ___ I was ready.",a:["if","whether"]},
{t:"mc",q:"“I have lost my keys.” → He said he ___ his keys.",o:["has lost","had lost","lost"],a:1},
{t:"mc",q:"“You should see a doctor.” → She advised me ___ a doctor.",o:["seeing","to see","see"],a:1},
{t:"gap",q:"“I didn't take the money.” → He denied ___ the money.",a:"taking"},
{t:"mc",q:"Choose the correct sentence.",o:["She asked me what was my name.","She asked me what my name was.","She asked me what is my name."],a:1}
]},
{id:"g-b2-5",title:"Modal verbs for deduction",
ex:`<p>We use modals to say how sure we are.</p><p><b>Present</b>: <i>must</i> (almost certain it's true), <i>might / may / could</i> (possible), <i>can't</i> (almost certain it's not true): <i>She's not answering. She <b>must be</b> busy. That <b>can't be</b> Tom – he's in Paris.</i></p><p><b>Past</b>: modal + <b>have + past participle</b>: <i>The streets are wet. It <b>must have rained</b>. He <b>might have missed</b> the bus. She <b>can't have seen</b> us.</i></p><p>Note: for negative deduction, use <b>can't</b>, not <i>mustn't</i>.</p>`,
vi:"Suy đoán: must (chắc chắn là đúng), might/may/could (có thể), can't (chắc chắn không đúng). Quá khứ: must/might/can't + have + V3. Không dùng “mustn't” để suy đoán phủ định.",
eg:["You must be hungry after that long walk.","He might be at the library.","They can't have finished already – they only started ten minutes ago.","She must have forgotten our meeting."],
q:[
{t:"mc",q:"The lights are off. They ___ be at home.",o:["must","can't","must have"],a:1},
{t:"mc",q:"He's been working all day. He ___ be exhausted.",o:["must","can't","mustn't"],a:0},
{t:"gap",q:"I can't find my wallet. I ___ have left it in the taxi. (possible)",a:["might","may","could"]},
{t:"mc",q:"The ground is wet. It ___ during the night.",o:["must rain","must have rained","can't rain"],a:1},
{t:"mc",q:"She ___ the email – she replied immediately.",o:["can't have read","must have read","might read"],a:1},
{t:"gap",q:"That ___ be true! It's impossible.",a:["can't","cannot"]},
{t:"mc",q:"Where's Linh? – She ___ be in the library, but I'm not sure.",o:["must","might","can't"],a:1},
{t:"mc",q:"He failed the test. He ___ studied enough.",o:["can't have","mustn't have","must"],a:0},
{t:"gap",q:"You ___ be Anna's sister – you look exactly like her! (almost certain)",a:"must"},
{t:"mc",q:"Choose the correct sentence.",o:["They must have went home.","They must have gone home.","They must gone home."],a:1}
]},
{id:"g-b2-6",title:"wish / if only",
ex:`<p><b>wish / if only + past simple</b> = regret about the present: <i>I <b>wish</b> I <b>had</b> more free time. If only I <b>were</b> taller.</i></p><p><b>wish / if only + past perfect</b> = regret about the past: <i>I <b>wish</b> I <b>hadn't said</b> that. If only we <b>had left</b> earlier!</i></p><p><b>wish + would</b> = annoyance or desire for someone else to change: <i>I <b>wish</b> you <b>would stop</b> talking.</i> (Not used about yourself: <s>I wish I would…</s>)</p><p><i>wish + could</i> = ability: <i>I wish I <b>could</b> play the guitar.</i></p>`,
vi:"wish/if only + quá khứ đơn: ước điều trái hiện tại. + quá khứ hoàn thành: hối tiếc về quá khứ. + would: mong người khác thay đổi hành vi (thường mang ý phàn nàn). + could: ước có khả năng.",
eg:["I wish I lived closer to the sea.","If only I had studied harder for the exam.","I wish my neighbours would turn their music down.","She wishes she could speak Japanese."],
q:[
{t:"mc",q:"I wish I ___ more money. (now)",o:["have","had","will have"],a:1},
{t:"mc",q:"I wish I ___ that. I'm sorry. (past)",o:["didn't say","hadn't said","wouldn't say"],a:1},
{t:"gap",q:"If only it ___ (stop) raining! (I want it to change)",a:"would stop"},
{t:"mc",q:"She wishes she ___ swim.",o:["can","could","would"],a:1},
{t:"gap",q:"I wish I ___ (be) taller.",a:["were","was"]},
{t:"mc",q:"If only we ___ the bus. Now we're late.",o:["didn't miss","hadn't missed","wouldn't miss"],a:1},
{t:"mc",q:"I wish you ___ leaving your clothes on the floor!",o:["stopped","would stop","had stopped"],a:1},
{t:"gap",q:"He wishes he ___ (go) to the concert last night.",a:"had gone"},
{t:"mc",q:"Choose the correct sentence.",o:["I wish I would be rich.","I wish I were rich.","I wish I am rich."],a:1},
{t:"mc",q:"Do you ever wish you ___ in another country?",o:["lived","live","will live"],a:0}
]},
{id:"g-b2-7",title:"Gerunds vs infinitives (advanced)",
ex:`<p>Some verbs change meaning with -ing or to + verb:</p><ul><li><b>remember / forget</b> + -ing = memory of a past action; + to = an action you need to do: <i>I remember <b>locking</b> the door. Remember <b>to lock</b> the door.</i></li><li><b>stop</b> + -ing = end an activity; + to = stop in order to do something: <i>He stopped <b>smoking</b>. He stopped <b>to smoke</b>.</i></li><li><b>try</b> + -ing = experiment; + to = make an effort: <i>Try <b>restarting</b> it. I tried <b>to open</b> it, but it was stuck.</i></li><li><b>regret</b> + -ing = sorry about the past; + to = formal bad news: <i>I regret <b>telling</b> him. We regret <b>to inform</b> you…</i></li><li><b>mean</b> + -ing = involve; + to = intend.</li></ul><p>Perfect and passive forms: <i>He denied <b>having taken</b> it. She expects <b>to be chosen</b>.</i></p>`,
vi:"Một số động từ đổi nghĩa: remember/forget + V-ing (nhớ/quên đã làm) vs + to V (nhớ/quên phải làm); stop + V-ing (ngừng hẳn) vs + to V (dừng lại để làm); try + V-ing (thử) vs + to V (cố gắng); regret + V-ing (hối hận đã làm) vs + to V (lấy làm tiếc phải báo).",
eg:["I'll never forget meeting her for the first time.","Don't forget to call your mother.","We stopped to buy some water.","Taking the job would mean moving to another city."],
q:[
{t:"mc",q:"I remember ___ this film as a child. (memory)",o:["to watch","watching","watch"],a:1},

{id:"r-b1-11", title:"The Four-Day Week", topic:"Work",
text:`Imagine working only four days a week for the same salary. For thousands of employees around the world, this is no longer a dream. In recent years, companies in countries such as the UK, Iceland, Spain and Japan have tested a four-day working week, and many have decided to keep it.

Supporters say that people work more efficiently when they know they have a long weekend. Meetings become shorter, and employees waste less time. A three-day weekend also gives people more time for their families, hobbies and exercise.

Experts believe that the idea will continue to spread, but probably in different forms. Some companies may let staff choose which day they take off, while others may offer shorter days instead. What is clear is that many people now want more balance between work and the rest of their lives.`,

{id:"r-b1-12", title:"Learning to Cook at University", topic:"Experiences",
text:`When Anh left home to study in Da Nang, she had never cooked a proper meal. At home, her mother and grandmother had always done the cooking, and Anh had only made instant noodles. "For the first month, I lived on noodles, bread and takeaway food," she laughs. "I spent too much money and I felt tired all the time."

Things changed when her flatmate, Thu, suggested that they cook together twice a week. Thu had worked in her family's restaurant and knew how to prepare simple, cheap dishes. On their first evening, they made fried rice with egg and vegetables. "It wasn't perfect, but it was the best meal I had eaten since I'd arrived," Anh says.

After a few weeks, Anh started looking for recipes online and calling her mother for advice. She learned to make soup, grilled fish and several kinds of stir-fried vegetables. She also discovered that planning meals for the week and shopping at the local market saved her a lot of money. She soon realised that cooking at home was not only cheaper but also much healthier than eating takeaway food every day.

Now, in her second year, Anh cooks almost every day and often invites classmates for dinner. "Cooking has become my way of relaxing after studying," she explains. "And it's a great way to make friends, because everyone loves free food!"

Her advice for new students is simple: start with three or four easy recipes, cook with friends, and don't worry about making mistakes. "My first attempts were terrible," she admits, "but that's how you learn."`,

{id:"r-b1-13", title:"Electric Scooters: Help or Problem?", topic:"Technology",
text:`In many cities around the world, shared electric scooters have appeared almost overnight. Using an app, you can find a scooter on the street, unlock it with your phone, ride it to your destination and leave it there. The cost is usually a small fee to start plus a few cents per minute.

Supporters say e-scooters are a cheap and fun way to make short journeys, especially for trips that are too far to walk but too short for a bus. Because they are electric, they don't produce pollution while they are being used, and they can help to reduce traffic if people use them instead of cars. They can also be a useful link to train and metro stations for people who live a little too far away to walk.

However, e-scooters have also caused many problems. Pedestrians complain that riders go too fast on pavements and that scooters are left in the middle of the street, where people can trip over them. There have been many accidents, and some riders have been seriously injured, often because they were not wearing helmets. In addition, studies have shown that many scooter trips replace walking or cycling, not car journeys, so the environmental benefits may be smaller than expected.

As a result, cities have introduced new rules. Paris, for example, held a public vote in 2023, and most voters chose to ban shared scooters. Other cities have set speed limits, created special parking areas or made helmets compulsory.

So, are e-scooters the future of city transport? Perhaps, but only if they are well managed and if riders behave responsibly.`,

{id:"r-b1-14", title:"Why I Started Running", topic:"Health",
text:`Two years ago, I couldn't run for more than a minute without stopping. I worked in an office, I spent my evenings on the sofa, and I often felt tired and stressed. One day, a colleague told me about a free app that helps beginners to start running. It sounded too easy, but I decided to try it.

The app's plan lasted nine weeks. In the first week, I had to run for one minute and then walk for ninety seconds, eight times. It was harder than I expected, and my legs hurt the next day. But the plan increased the running time very slowly, so I never felt that it was impossible. Some evenings I didn't want to go out at all, but I always felt better afterwards.

After about a month, I noticed some changes. I was sleeping better, I had more energy at work, and I felt calmer. I also started to enjoy the time on my own, listening to music or podcasts while I ran along the river.

At the end of the nine weeks, I could run for thirty minutes without stopping. I was so proud that I signed up for a five-kilometre race in my city. I finished it in thirty-four minutes, and the atmosphere at the finish line was amazing.

Since then, I have run two ten-kilometre races, and I've joined a running club that meets twice a week. I'm not fast, but that doesn't matter. Running has helped me to stay healthy, make new friends and deal with stress. If I can do it, anyone can!`,

{id:"r-b1-15", title:"Choosing a Course After School", topic:"School and plans",
text:`At the end of secondary school, many students face a difficult question: what should I study next? Choosing a course can affect your career, your friends and even where you live, so it is natural to feel nervous. Here is some advice from university advisers.

First, think about what you enjoy. Students who study a subject they find interesting usually work harder and get better results. Ask yourself which lessons make time pass quickly and which topics you read about in your free time.

Second, research the jobs that the course can lead to. Some degrees, such as medicine or engineering, prepare you for a specific profession. Others, like history or languages, develop general skills that are useful in many careers. Look at websites, talk to people who work in those fields and, if possible, do some work experience.

Third, find out as much as possible about the course itself. Two courses with the same name can be very different. Check the modules you will study, how you will be assessed and whether there are opportunities to study abroad or do an internship.

Don't forget practical questions, too. How much will the course cost? Can you get a scholarship? Would you prefer to study in a big city or a smaller town?

Finally, don't choose a course only because your friends are doing it or because your parents want you to. It is your future, so listen to advice, but make the decision yourself. And remember: if you realise later that you have made the wrong choice, it is usually possible to change.`,

{id:"r-b2-11", title:"The Hidden Life of Cities at Night", topic:"Society",
text:`When most people go to bed, cities do not simply switch off. Hospitals, power stations, delivery services, cleaning companies and food markets all depend on workers who start their day when others are finishing theirs. In many large cities, as much as a fifth of the workforce regularly works at night, and this "night-time economy" is becoming increasingly important.

For some, night work offers clear advantages. Pay is often higher, the roads are quieter, and there may be fewer managers around. Students and parents sometimes choose night shifts because they fit around studies or childcare. Many cities also have a lively evening culture of restaurants, theatres and music venues, which brings in tourists and generates considerable income.

However, there is growing evidence that working through the night comes at a cost. Humans are designed to be active during daylight, and disrupting our internal body clock can affect sleep, digestion and mood. Long-term night workers have been found to have a higher risk of conditions such as heart disease and diabetes, although researchers stress that lifestyle factors also play a role. Social life can suffer too: it is difficult to see friends or attend family events when your timetable is the opposite of theirs.

Cities themselves have often been slow to recognise the needs of night workers. Public transport may stop running at midnight, leaving people with expensive taxis or long walks home through poorly lit streets. Shops and services close just when night workers have time to use them. Night workers who want to see a doctor, visit a bank or attend a meeting at their child's school often have to do so when they should be sleeping. Safety, particularly for women travelling alone, is a recurring concern.

In response, some cities have appointed "night mayors" or night-time commissioners. Their role is to represent businesses, residents and workers who are active after dark, and to balance the interests of those who want a vibrant nightlife with those who simply want to sleep. Amsterdam was among the first to create such a position, and London, New York and Sydney have followed with similar roles.

Practical measures range from running trains all night at weekends to improving street lighting and offering health checks designed for shift workers. Advocates argue that a well-managed night-time economy can make cities safer, more inclusive and more economically dynamic. The challenge is to ensure that the people who keep cities running around the clock are not forgotten simply because they work while the rest of us are asleep.`,

{id:"r-b2-12", title:"Should Homework Be Abolished?", topic:"Education (opinion)",
text:`Few aspects of school life provoke as much debate among parents, teachers and students as homework. Some countries assign hours of it every evening, while others have reduced it dramatically. So, is homework a valuable tool for learning or an outdated tradition that should be abolished?

Supporters of homework argue that it reinforces what students learn in class. Practising a new maths technique or reviewing vocabulary at home helps information move into long-term memory. Homework can also teach independence, time management and responsibility, skills that will be essential at university and in the workplace. In addition, it gives parents a window into what their children are studying.

Critics, however, point out that the evidence is more mixed than many people assume. Research suggests that for older secondary students, a moderate amount of homework is linked to better results, but for younger children the benefits are small or non-existent. Beyond a certain point, extra homework seems to bring no additional gains and may even be counterproductive, leading to stress, lack of sleep and less time for exercise, hobbies and family. A number of education researchers have also noted that the quality of a task appears to matter more than the time students spend on it.

There is also an issue of fairness. Students from wealthier families are more likely to have a quiet room, a computer, internet access and parents who can help. Those without such resources may struggle to complete assignments, so homework can unintentionally widen the gap between advantaged and disadvantaged students.

In my view, abolishing homework entirely would be a mistake, but the way it is set needs to change. Homework should be short, purposeful and clearly connected to classroom learning, rather than simply "finishing the exercise". Reading for pleasure, preparing questions for the next lesson or completing a short online quiz can be more effective than pages of repetitive tasks. Teachers should also coordinate so that students do not receive large assignments from several subjects on the same night.

Schools could support students by offering homework clubs where they can work in a calm environment with access to computers and staff who can help. That way, homework becomes an opportunity rather than a source of inequality.

Ultimately, the question is not whether homework is good or bad, but whether it is well designed. Quality matters far more than quantity, and a thoughtful twenty-minute task is likely to achieve more than two hours of busy work.`,

{id:"r-b2-13", title:"The Race to Save Coral Reefs", topic:"Environment",
text:`Coral reefs cover less than one per cent of the ocean floor, yet they support around a quarter of all marine species. They protect coastlines from storms, provide food and income for hundreds of millions of people, and attract tourists from all over the world. Today, however, reefs are in serious danger, and scientists are racing to find ways of saving them. Their success or failure will affect not only marine life but also the many coastal communities that depend on healthy reefs for their survival.

The greatest threat is rising sea temperatures. Corals live in partnership with tiny algae that live inside their tissues, giving them both food and their bright colours. When the water becomes too warm for too long, corals expel these algae and turn white, a process known as bleaching. Bleached corals are not dead, but if temperatures do not return to normal quickly, they may starve. Mass bleaching events, which affect huge areas at once, have become far more frequent in recent decades. Australia's Great Barrier Reef, the largest reef system on Earth, has suffered several since 2016.

Other pressures make the situation worse. Pollution from farms and cities carries nutrients and sediment into the sea, reducing water quality. Overfishing removes species that keep reefs healthy, such as fish that eat algae. Destructive practices, including fishing with explosives, and careless tourism, such as touching or standing on corals, cause further damage. Meanwhile, the ocean is becoming more acidic as it absorbs carbon dioxide, which makes it harder for corals to build their skeletons.

Scientists are experimenting with a range of solutions. Some are growing coral fragments in underwater "nurseries" and replanting them on damaged reefs. Others are selectively breeding corals that can tolerate higher temperatures, or studying naturally resilient reefs to understand their secrets. More ambitious ideas include shading reefs with fine sprays of seawater that brighten clouds and reflect sunlight.

These efforts are important, but researchers are clear that they cannot replace action on climate change. Restoration projects can protect valuable areas and buy time, but they operate on a tiny scale compared with the size of the world's reefs. Without significant cuts in greenhouse gas emissions, many experts fear that most reefs could be severely degraded by the end of the century.

Local action still matters. Well-managed marine protected areas, reduced pollution and responsible tourism can make reefs more resilient, giving them a better chance of recovering after bleaching events.`,

{id:"r-b2-14", title:"Artificial Intelligence at Work", topic:"Science and technology",
text:`Only a few years ago, artificial intelligence seemed like something from science fiction. Today, AI tools write emails, translate documents, summarise reports, generate images and even help doctors read medical scans. As these systems become more capable, one question dominates public debate: what will AI mean for our jobs?

Previous waves of technology mainly affected routine manual work. Machines replaced many factory and farm jobs, while computers took over tasks such as filing and basic calculation. What makes the current wave different is that it reaches into areas once considered uniquely human, including writing, design, analysis and customer service. Some economists estimate that a significant share of tasks in office-based jobs could be automated, at least in part.

However, automating a task is not the same as eliminating a job. Most jobs consist of many different tasks, and AI is better at some than others. A lawyer might use software to search thousands of documents in minutes, but still needs to advise clients, negotiate and appear in court. In many cases, AI may act as an assistant that removes repetitive work and allows people to focus on more complex or creative aspects of their role. Early studies suggest that less experienced workers may benefit most, as AI tools help them reach the standard of more senior colleagues more quickly.

Nevertheless, the transition is unlikely to be painless. Some roles, particularly those built around producing standard text or answering simple queries, may shrink considerably. Workers whose skills become less valuable may find it difficult to retrain, especially later in their careers. There are also concerns about the quality and reliability of AI output: these systems can produce confident but inaccurate answers, reproduce biases found in their training data, and raise questions about privacy and copyright.

How societies respond will shape the outcome. Governments and employers can invest in training so that workers learn to use AI effectively and move into growing areas. Schools and universities may need to place greater emphasis on skills that machines find hard to replicate, such as critical thinking, ethical judgement, collaboration and communication. Clear rules about transparency, for instance requiring companies to disclose when customers are dealing with an AI system, could help to maintain public trust.

History suggests that new technologies tend to destroy some jobs while creating others that were previously unimaginable. Whether AI ultimately widens inequality or raises living standards for most people will depend less on the technology itself than on the choices we make about how to use it.`,

{id:"r-b2-15", title:"Tourism: Blessing or Burden?", topic:"Society and environment",
text:`For many destinations, tourism is an economic lifeline. It creates jobs in hotels, restaurants, transport and shops, supports local crafts and can fund the protection of historic sites and natural areas. In Vietnam, places such as Hoi An, Ha Long Bay and Sa Pa have been transformed by visitors from around the world. Yet in recent years, a growing number of residents in popular destinations have begun to ask whether there can be too much of a good thing.

The term "overtourism" describes situations in which the number of visitors damages the quality of life for local people or the experience of tourists themselves. In cities such as Venice, Barcelona and Amsterdam, residents have complained about crowded streets, noise and rising rents as apartments are converted into holiday rentals. Some long-standing residents have been pushed out of their own neighbourhoods. In natural areas, heavy visitor numbers can lead to erosion, litter and disturbance to wildlife. Popular hiking trails can become so crowded at weekends that walkers have to queue on narrow paths, which rather defeats the purpose of escaping to nature.

The economic benefits, too, are not always shared fairly. Much of the money spent by tourists may go to large international companies rather than local businesses, and many tourism jobs are seasonal and poorly paid. Communities that become dependent on tourism can be particularly vulnerable when visitor numbers suddenly fall, as many discovered during the pandemic.

Destinations are experimenting with different responses. Venice has introduced an entry fee for day-trippers on busy days, while Amsterdam has restricted new hotels and holiday rentals in the city centre. Some national parks limit the number of daily visitors or require advance booking. Others are trying to spread tourism more evenly, promoting lesser-known regions and encouraging travel outside the peak season.

Tourists can also make a difference. Choosing locally owned accommodation, eating in family-run restaurants, respecting local customs and avoiding the most crowded times can all reduce negative impacts. Staying longer in one place, rather than rushing between famous sights, often benefits local economies more and provides a richer experience.

Tourism, then, is neither simply a blessing nor a burden. Managed well, it can support livelihoods, encourage cultural exchange and fund conservation. Managed poorly, it can damage the very places that people travel to see. The key is to plan tourism around the needs of local communities, rather than expecting communities to adapt to unlimited growth.`,
g:{lifeline:["phao cứu sinh, nguồn sống","something very important for survival"],craft:["nghề thủ công","making things by hand"],overtourism:["quá tải du lịch","too many tourists in one place"],convert:["chuyển đổi","change into something else"],seasonal:["theo mùa","only at certain times of year"],pandemic:["đại dịch","a disease that spreads around the world"],"day-tripper":["khách đi trong ngày","a visitor who does not stay overnight"],peak:["cao điểm","the busiest time"],livelihood:["sinh kế","the way you earn money to live"],burden:["gánh nặng","a heavy responsibility or problem"]},

{id:"l-b2-6", title:"The Four-Day Week Debate", type:"Discussion", speakers:{A:"Host",B:"Claire",C:"Marcus"},
lines:[["A","Today's question: should the four-day working week become the norm? Claire, you run a marketing agency that switched two years ago."],["B","That's right. We kept salaries the same and reduced hours from forty to thirty-two. Honestly, I was sceptical at first, but productivity has held up, staff turnover has dropped, and recruitment is far easier. Candidates now actively seek us out."],["C","I don't doubt it works for some office-based businesses. But I run a chain of care homes, and our residents need support every hour of every day. A four-day week for my staff would mean hiring roughly twenty per cent more people, and frankly, the funding simply isn't there."],["B","I accept that it's not a one-size-fits-all solution. But even in sectors like yours, there might be flexible arrangements, such as compressed hours or longer rest periods between shifts, that achieve some of the same benefits."],["C","Perhaps, but compressed hours can be counterproductive in care. Twelve-hour shifts are exhausting, and fatigue leads to mistakes."],["A","So is there a risk that the four-day week widens the gap between different types of workers?"],["C","Absolutely. If it becomes a perk mainly for well-paid professionals, those in essential services may feel left behind."],["B","That's a fair point. Any national policy would need to come with proper investment in sectors that can't simply cut hours."]],

{id:"l-b2-7", title:"Why We Procrastinate", type:"Talk", speakers:{A:"Psychologist"},
lines:[["A","Almost everyone procrastinates from time to time, putting off a task even though we know that delaying it will make things worse. For a long time, procrastination was seen simply as a problem of laziness or poor time management. Recent research, however, suggests that it is primarily about emotions."],["A","When a task makes us feel anxious, bored or uncertain, avoiding it brings immediate relief. Scrolling through our phones or tidying the desk feels better in the moment, so the brain learns to repeat that behaviour. The problem, of course, is that the task doesn't disappear, and the stress usually grows."],["A","Understanding this changes the solution. Rather than relying on willpower or ever more detailed schedules, it helps to reduce the emotional cost of starting. One technique is to break a large task into a very small first step, such as writing a single sentence or opening the relevant file. Another is to commit to working for just five minutes; once we begin, continuing is often far easier."],["A","Self-compassion also plays a surprising role. Studies have found that students who forgave themselves for procrastinating before one exam were less likely to procrastinate before the next. Criticising ourselves harshly tends to increase negative feelings, which, ironically, makes avoidance more tempting."],["A","So the next time you find yourself delaying something important, ask not 'Why am I so lazy?' but 'What feeling am I trying to avoid?'"]],
q:[{t:"mc",q:"According to recent research, procrastination is mainly about…",o:["laziness","poor time management","emotions"],a:2},{t:"mc",q:"Why does the brain repeat avoidance?",o:["It brings immediate relief.","It saves energy.","It improves memory."],a:0},{t:"mc",q:"Which technique is recommended?",o:["Making a very detailed schedule","Committing to work for five minutes","Working only at night"],a:1},{t:"mc",q:"What did the study on self-compassion find?",o:["It made students lazier.","Students who forgave themselves procrastinated less later.","It had no effect."],a:1}],
gap:"Avoiding it brings immediate [relief]. Break a large task into a very small first [step]. Criticising ourselves harshly tends to increase negative [feelings].",
dict:"Once we begin, continuing is often far easier."},
{id:"l-b2-8", title:"Is Fast Fashion Worth It?", type:"Interview", speakers:{A:"Interviewer",B:"Designer"},
lines:[["A","You've built a clothing brand around repair and reuse. Why did you leave the mainstream fashion industry?"],["B","I worked for a large retailer for eight years, and I became increasingly uncomfortable with the pace. We were launching new collections almost every fortnight, and I knew that much of what we produced would be worn a handful of times before being thrown away."],["A","But fast fashion makes clothes affordable for people on low incomes. Isn't that a good thing?"],["B","It's a genuine concern, and I don't want to lecture anyone. But cheap clothes often aren't cheap in the long run if they fall apart after a few washes. Buying second-hand, or buying one good-quality item instead of three poor ones, can actually save money."],["A","What does your business do differently?"],["B","Every item comes with free repairs for life. We also take back old clothes, ours or anyone else's, and either resell them or turn the fabric into new products. Customers tell us they value clothes more when they know they can keep them for years."],["A","Can a model like yours compete with the big brands?"],["B","Not on price alone. But I think there's a growing number of consumers, especially younger ones, who care about where their clothes come from. And if governments make producers responsible for waste, the economics could change very quickly."]],
q:[{t:"mc",q:"Why did the designer leave the retailer?",o:["She was fired.","She was uncomfortable with the speed of production.","She wanted a higher salary."],a:1},{t:"mc",q:"How often did the retailer launch collections?",o:["Every fortnight","Every month","Twice a year"],a:0},{t:"mc",q:"What does her brand offer with every item?",o:["A discount on the next purchase","Free repairs for life","A free bag"],a:1},{t:"mc",q:"What could change the economics quickly?",o:["Lower cotton prices","Governments making producers responsible for waste","More advertising"],a:1}],
gap:"Much of what we produced would be worn a [handful] of times. Cheap clothes often aren't cheap in the long [run]. Customers [value] clothes more when they can keep them for years.",
dict:"Buying one good-quality item instead of three poor ones can actually save money."},
{id:"l-b2-9", title:"Space Exploration: Is It Worth the Cost?", type:"Discussion", speakers:{A:"Host",B:"Dr Okafor",C:"Ben"},
lines:[["A","Space agencies and private companies are spending billions on missions to the Moon and Mars. Dr Okafor, as an astrophysicist, how do you justify that?"],["B","Space research has given us far more than people realise: satellite navigation, weather forecasting, water purification systems and medical imaging all owe something to space technology. Satellites are also essential for monitoring climate change, deforestation and natural disasters."],["C","I don't dispute that satellites are useful. My concern is with the crewed missions to Mars. The money involved could transform healthcare or fight poverty here on Earth."],["B","The budgets are smaller than many assume, though. NASA receives well under one per cent of US federal spending. And international cooperation in space has historically been a rare area where rival countries work together."],["C","That's true for public agencies, but private companies are increasingly driven by profit and prestige. Who decides how space is used, and who benefits?"],["B","That's a legitimate question. We urgently need clearer international rules, for example on space debris, which is a growing danger to the satellites we all depend on."],["A","So perhaps the debate isn't whether to explore, but how?"],["C","Exactly. I'd support exploration that is transparent, shares its benefits widely and doesn't create a new mess in orbit."]],

gap:"Satellites are essential for monitoring climate [change]. International [cooperation] in space has been rare. Space [debris] is a growing danger.",
dict:"The debate isn't whether to explore, but how."}
