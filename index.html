<!-- EXTRA-CONTENT-END -->
<script>
/* =====================================================================
   APP CORE: utilities, state, speech, dictionary, quiz engine
   ===================================================================== */
const LEVELS = ["A2","B1","B2"];
const SKILLS = ["reading","listening","speaking","writing"];
const SKILL_INFO = {reading:{icon:"📖",name:"Reading"},listening:{icon:"🎧",name:"Listening"},speaking:{icon:"🎤",name:"Speaking"},writing:{icon:"✍️",name:"Writing"},grammar:{icon:"🧩",name:"Grammar"},vocab:{icon:"🗂️",name:"Vocabulary"},tests:{icon:"🏆",name:"Tests"}};
const DAY = 864e5;

/* ---------- DOM helpers ---------- */
// Let element.append() ignore null/false so optional parts can be passed inline.
const _nativeAppend = Element.prototype.append;
Element.prototype.append = function (...nodes) { return _nativeAppend.apply(this, nodes.filter(n => n != null && n !== false)); };
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const norm = s => String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' -]/g, " ").replace(/-/g, " ").replace(/\s+/g, " ").trim();
const countWords = s => (String(s).trim().match(/[A-Za-zÀ-ỹ0-9'’-]+/g) || []).length;
const fmtMin = sec => Math.round(sec / 60);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function toast(msg, type) { const t = h("div", {style: type === "bad" ? "background:var(--bad);color:#fff" : ""}, msg); $("#toast").append(t); setTimeout(() => t.remove(), 3200); }
function levelChip(lv) { return h("span", {class: "chip lv " + lv}, lv); }
function bar(p, color) { return h("div", {class: "bar"}, h("i", {style: `width:${Math.max(0, Math.min(100, p))}%;${color ? "background:" + color : ""}`})); }
function viBox(text) { return text ? h("div", {class: "vi"}, text) : null; }

/* ---------- Lookup helpers for content ---------- */
function allOf(kind) { return LEVELS.flatMap(lv => (DATA[kind][lv] || []).map(x => ({...x, level: lv}))); }
function findItem(kind, id) { for (const lv of LEVELS) { const it = (DATA[kind][lv] || []).find(x => x.id === id); if (it) return {...it, level: lv}; } return null; }
function levelOfId(id) { const m = /-(a2|b1|b2)-/i.exec(id || ""); return m ? m[1].toUpperCase() : null; }

/* =====================================================================
   STATE (saved in localStorage)
   ===================================================================== */
const STORE_KEY = "englishpath_v1";
function defaultState() {
  return {
    version: 1, created: Date.now(), level: "A2", subLevel: null, placement: null,
    unlocked: {A2: true, B1: false, B2: false}, stageTests: {}, unitTests: {},
    done: {}, scores: [], vocab: {}, writings: [], speakings: [],
    streak: {count: 0, best: 0, last: null}, days: {}, weeklyGoal: 150,
    settings: {theme: (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light", accent: "US", rate: 1, vi: {A2: true, B1: true, B2: false}},
    plan: null, badges: {}, selfChecks: {}
  };
}
function deepMerge(base, obj) {
  for (const k in obj) {
    const b = base[k], o = obj[k];
    if (o && typeof o === "object" && !Array.isArray(o) && b && typeof b === "object" && !Array.isArray(b)) base[k] = deepMerge(b, o);
    else base[k] = o;
  }
  return base;
}
function loadState() { try { const raw = JSON.parse(localStorage.getItem(STORE_KEY)); if (raw && raw.version) return deepMerge(defaultState(), raw); } catch (e) {} return defaultState(); }
let S = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { console.warn(e); } }

/* Record a score for a skill. id = activity id (optional). */
function recordScore(skill, score, id) {
  score = Math.max(0, Math.min(100, Math.round(score)));
  S.scores.push({d: Date.now(), skill, s: score, id: id || null});
  if (id) {
    const prev = S.done[id];
    S.done[id] = {score: Math.max(score, prev ? prev.score : 0), last: score, date: Date.now(), n: (prev ? prev.n : 0) + 1, skill};
  }
  touchStreak(); planTick(id, skill); checkBadges(); save();
}
function touchStreak() {
  const t = todayKey(); if (S.streak.last === t) return;
  const y = todayKey(new Date(Date.now() - DAY));
  S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;

const EX_STOP = new Set("the a an and or but so to of in on at for with is are was were be been being it its this that these those there their they he she we you his her our your my me him them as by from not no do does did have has had will would can could should may might must than then very also just about into out up what which who when where why how all some any more most much many such only one two get got".split(" "));

  const sents = exSentences(source); if (!sents.length) return null;
  const keys = new Set(exWords(query).map(exStem));
  // words that appear in many sentences (e.g. the topic word) are weak evidence: weight = 1 / document frequency
  const df = {}; const sentStems = sents.map(s => new Set(exWords(s).map(exStem)));
  sentStems.forEach(set => set.forEach(w => df[w] = (df[w] || 0) + 1));
  let best = null, bestScore = 0;
  sents.forEach((s, i) => {
    let sc = 0;
    sentStems[i].forEach(w => { if (keys.has(w)) sc += 1 / df[w]; });
    if (must && norm(s).includes(norm(must))) sc += 2;
    if (sc > bestScore) { bestScore = sc; best = s; }

  return bestScore > 0.3 ? {sentence: best, keys} : null;
}
function exHighlight(sentence, keys) {
  const span = h("span");
  sentence.split(/([A-Za-z0-9'’]+)/).forEach(part => {
    if (/^[A-Za-z0-9]/.test(part) && part.length > 2 && keys.has(exStem(part.toLowerCase().replace(/[’]/g, "'")))) span.append(h("mark", {}, part));

function editDistance(a, b) {

    add(h("b", {}, "Correct answer: "), item.correctText);
    if (q.t === "tf" || q.t === "tfng") {
      const key = q.t === "tf" ? (q.a ? "T" : "F") : q.a;
      const msg = {
        T: ["True – the text says the same idea, often with different words (a paraphrase).", "TRUE: bài nói cùng ý với câu này (thường được diễn đạt bằng từ khác)."],
        F: ["False – the text says something different or the opposite. Compare the highlighted words carefully.", "FALSE: bài nói khác hoặc ngược lại. Hãy so sánh các từ được tô màu."],
        NG: ["Not Given – the text does not give this information, so we cannot say if it is true or false.", "NOT GIVEN: bài không có thông tin này nên không thể kết luận đúng hay sai. Đừng dùng hiểu biết bên ngoài bài."]

        ev ? h("div", {class: "small muted"}, (isListening ? "🎧 " : "📍 ") + "“", exHighlight(ev.sentence, new Set(exWords(d.ans).map(exStem))), "”") : null);

    vi.push("Mỗi chỗ trống có câu gốc trong bài nghe/bài đọc (từ cần điền được tô màu). Nghe lại đoạn đó để kiểm tra.");
  } else if (q.t === "match") {
    item.details.forEach(d => {
      const ev = src ? findEvidence(src, d.left + " " + d.correct, d.left) : null;
      add(d.ok ? "✓ " : "✗ ", h("b", {}, d.left), " → ", d.correct, !d.ok && d.user ? h("span", {class: "muted"}, "  (you chose: " + d.user + ")") : null,
        ev ? h("div", {class: "small muted"}, "📍 “", exHighlight(ev.sentence, ev.keys), "”") : null);

    if (total >= 70 && next && !S.unlocked[next]) { S.unlocked[next] = true; toast("🔓 " + next + " unlocked!"); }
    checkBadges(); save();
    res.innerHTML = "";
    res.append(h("div", {class: "card", style: "border:2px solid " + (total >= 70 ? "var(--ok)" : "var(--warn)")},
      h("h2", {}, (total >= 70 ? "✅ Passed! " : "Not yet – ") + total + "%"),
      h("table", {}, Object.entries(parts).map(([k, v]) => h("tr", {}, h("td", {}, k), h("td", {style: "width:50%"}, bar(v)), h("td", {}, v + "%")))),
      total >= 70 && next ? h("button", {class: "btn primary", onclick: () => { S.level = next; S.plan = null; save(); $("#levelSelect").value = next; go("roadmap"); }}, "Move to " + next + " →") : h("p", {}, total >= 70 ? "🏆 Congratulations – you have completed the B2 stage!" : "You need 70% to pass. Review the weakest section and try again."),
      h("details", {}, h("summary", {}, "Writing feedback"), writingFeedback(a, W, lv))));
    res.scrollIntoView({behavior: "smooth"});
  };
  view.append(backLink("roadmap", "Roadmap"),
    h("div", {class: "card"}, levelChip(lv), h("h1", {}, lv + " stage test"), h("p", {}, "Five sections, each worth 20%. Pass mark: 70%. Take your time – about 40 minutes."), viBox("Bài kiểm tra cuối giai đoạn gồm 5 phần: Đọc, Nghe, Ngữ pháp & Từ vựng, Viết, Nói. Đạt từ 70% để mở khóa giai đoạn tiếp theo.")),
    h("div", {class: "card"}, h("h2", {}, "1 · Reading: " + passage.title), h("div", {class: "passage"}, passage.text.split(/\n\s*\n/).map((p, i) => h("p", {}, passage.q.some(q => q.t === "head") ? h("span", {class: "plabel"}, String.fromCharCode(65 + i)) : null, p))), qR),
    h("div", {class: "card"}, h("h2", {}, "2 · Listening: " + lis.title), playerControls(() => lis.lines, lis.speakers), qL),
    h("div", {class: "card"}, h("h2", {}, "3 · Grammar & vocabulary"), qG),
    h("div", {class: "card"}, h("h2", {}, "4 · Writing"), h("p", {}, W.prompt), h("p", {class: "small muted"}, W.min + "–" + W.max + " words"), ta, wc),
    h("div", {class: "card"}, h("h2", {}, "5 · Speaking: read aloud"), !SR ? srNotice() : null, spkBox),
    h("div", {class: "card center"}, h("button", {class: "btn primary", style: "font-size:1.1rem;padding:12px 24px", onclick: submit}, "Submit stage test")), res);
}

/* ---------- Chart (canvas, no libraries) ---------- */
function drawChart(canvas) {
  const colors = {reading: "#10b981", listening: "#3b82f6", speaking: "#f59e0b", writing: "#ec4899", grammar: "#8b5cf6", vocab: "#14b8a6", tests: "#64748b"};
  const dpr = devicePixelRatio || 1; const W = canvas.clientWidth, H = 260;
  canvas.width = W * dpr; canvas.height = H * dpr; const c = canvas.getContext("2d"); c.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement); const muted = css.getPropertyValue("--muted"), border = css.getPropertyValue("--border");
  const pad = {l: 34, r: 10, t: 10, b: 26}; const xs = S.scores.map(s => s.d); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 - x0 < DAY) { x0 -= DAY / 2; x1 += DAY / 2; }
  const X = d => pad.l + (d - x0) / (x1 - x0) * (W - pad.l - pad.r), Y = v => pad.t + (100 - v) / 100 * (H - pad.t - pad.b);
  c.font = "11px system-ui"; c.fillStyle = muted; c.strokeStyle = border; c.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => { c.beginPath(); c.moveTo(pad.l, Y(v)); c.lineTo(W - pad.r, Y(v)); c.stroke(); c.fillText(v, 4, Y(v) + 4); });
  [x0, (x0 + x1) / 2, x1].forEach((d, i) => { const t = new Date(d).toLocaleDateString(undefined, {day: "numeric", month: "short"}); c.fillText(t, Math.min(W - 50, Math.max(pad.l, X(d) - (i === 1 ? 20 : i === 2 ? 45 : 0))), H - 8); });
  const legend = $("#legend"); legend.innerHTML = "";
  Object.keys(colors).forEach(sk => {
    const pts = S.scores.filter(s => s.skill === sk); if (!pts.length) return;
    c.strokeStyle = colors[sk]; c.fillStyle = colors[sk]; c.lineWidth = 2; c.beginPath();
    pts.forEach((p, i) => i ? c.lineTo(X(p.d), Y(p.s)) : c.moveTo(X(p.d), Y(p.s))); c.stroke();
    pts.forEach(p => { c.beginPath(); c.arc(X(p.d), Y(p.s), 3, 0, 7); c.fill(); });
    const avg = Math.round(pts.reduce((a, b) => a + b.s, 0) / pts.length);
    legend.append(h("span", {class: "chip", style: `background:${colors[sk]};color:#fff`}, SKILL_INFO[sk].name + " · avg " + avg + "%"));
  });
}

/* ---------- Badges ---------- */
const countDone = prefix => Object.keys(S.done).filter(k => k.startsWith(prefix)).length;
const BADGES = [
  {id: "first", icon: "👣", name: "First step", desc: "Complete your first activity", test: () => Object.keys(S.done).length >= 1},
  {id: "placement", icon: "🧭", name: "Know your level", desc: "Finish the placement test", test: () => S.placement && S.placement.score != null},
  {id: "streak3", icon: "🔥", name: "On fire", desc: "3-day streak", test: () => S.streak.best >= 3},
  {id: "streak7", icon: "📆", name: "One week strong", desc: "7-day streak", test: () => S.streak.best >= 7},
  {id: "streak30", icon: "💎", name: "Unstoppable", desc: "30-day streak", test: () => S.streak.best >= 30},
  {id: "words50", icon: "📚", name: "Word collector", desc: "Save 50 words", test: () => Object.keys(S.vocab).length >= 50},
  {id: "learned100", icon: "🧠", name: "Memory master", desc: "Learn 100 words (box 3+)", test: () => learnedCount() >= 100},
  {id: "act10", icon: "🚀", name: "Getting going", desc: "Complete 10 activities", test: () => Object.keys(S.done).length >= 10},
  {id: "act50", icon: "🏃", name: "Marathon learner", desc: "Complete 50 activities", test: () => Object.keys(S.done).length >= 50},
  {id: "reader", icon: "📖", name: "Bookworm", desc: "Finish 10 reading passages", test: () => countDone("r-") >= 10},
  {id: "listener", icon: "🎧", name: "Good listener", desc: "Finish 5 listening tasks", test: () => countDone("l-") >= 5},
  {id: "speaker", icon: "🎤", name: "Brave speaker", desc: "Finish 5 speaking tasks", test: () => countDone("s-") + countDone("p-") >= 5},
  {id: "writer", icon: "✍️", name: "Writer", desc: "Submit 5 pieces of writing", test: () => S.writings.length >= 5},
  {id: "grammar10", icon: "🧩", name: "Grammar guru", desc: "Finish 10 grammar lessons", test: () => countDone("g-") >= 10},
  {id: "perfect", icon: "🌟", name: "Perfect!", desc: "Get 100% in any activity", test: () => S.scores.some(s => s.s === 100)},
  {id: "hour", icon: "⏱️", name: "First hour", desc: "Study for 1 hour in total", test: () => totalSeconds() >= 3600},
  {id: "hours10", icon: "⌛", name: "Dedicated", desc: "Study for 10 hours in total", test: () => totalSeconds() >= 36000},
  {id: "A2done", icon: "🟢", name: "A2 complete", desc: "Pass the A2 stage test", test: () => (S.stageTests.A2 || {}).best >= 70},
  {id: "B1done", icon: "🔵", name: "B1 complete", desc: "Pass the B1 stage test", test: () => (S.stageTests.B1 || {}).best >= 70},
  {id: "B2done", icon: "🟣", name: "B2 complete", desc: "Pass the B2 stage test", test: () => (S.stageTests.B2 || {}).best >= 70}
];
function checkBadges() { for (const b of BADGES) { try { if (!S.badges[b.id] && b.test()) { S.badges[b.id] = Date.now(); toast("🏅 Badge earned: " + b.name); } } catch (e) {} } }

/* ---------- Export / import ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: "application/json"});
  const a = h("a", {href: URL.createObjectURL(blob), download: "englishpath-progress-" + todayKey() + ".json"}); document.body.append(a); a.click(); a.remove();
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => { try { const obj = JSON.parse(r.result); if (!obj || !obj.version) throw new Error("bad"); S = deepMerge(defaultState(), obj); save(); applyTheme(); $("#levelSelect").value = S.level; route(); toast("Progress imported ✓"); } catch (e) { toast("This file is not a valid progress file.", "bad"); } };
  r.readAsText(file);
}

/* =====================================================================
   INIT
   ===================================================================== */
(function init() {
  buildDict(); TTS.init(); applyTheme();
  $("#levelSelect").value = S.level;
  $("#levelSelect").onchange = e => { S.level = e.target.value; S.plan = null; save(); const p = (location.hash.replace(/^#\/?/, "") || "dashboard").split("/")[0]; if (["reading", "listening", "speaking", "writing", "grammar"].includes(p)) go(p + "/" + S.level); else route(); };
  $("#viToggle").onchange = e => { S.settings.vi[viewLevel] = e.target.checked; save(); applyVi(); };
  $("#themeBtn").onclick = () => { S.settings.theme = S.settings.theme === "dark" ? "light" : "dark"; save(); applyTheme(); if (location.hash.startsWith("#/tests")) route(); };
  $("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#overlay").classList.add("show"); };
  $("#overlay").onclick = closeSidebar;
  addEventListener("hashchange", route);
  route();
})();
