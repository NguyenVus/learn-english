<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishPath · A2 → B1 → B2</title>
<style>
/* ===================== THEME ===================== */
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#eef1f8;--text:#1d2433;--muted:#667085;--border:#e2e6ef;
  --primary:#4f46e5;--primary-soft:#eef0ff;--ok:#15803d;--ok-soft:#dcfce7;--bad:#dc2626;--bad-soft:#fee2e2;
  --warn:#b45309;--warn-soft:#fef3c7;--A2:#10b981;--B1:#3b82f6;--B2:#8b5cf6;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
}
[data-theme=dark]{
  --bg:#0e1120;--surface:#171b2e;--surface2:#20253f;--text:#e6e9f4;--muted:#9aa3b8;--border:#2b3154;
  --primary:#818cf8;--primary-soft:#272d57;--ok:#4ade80;--ok-soft:#133022;--bad:#f87171;--bad-soft:#3a1616;
  --warn:#fbbf24;--warn-soft:#382c0c;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:16px}
a{color:var(--primary)}
button{font:inherit}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}
.hidden{display:none!important}

/* ===================== LAYOUT ===================== */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;padding:4px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--A2),var(--B1),var(--B2));display:grid;place-items:center;color:#fff}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--surface2)}
.nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav .ico{width:22px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}
.topbar .title{font-weight:700;flex:1;min-width:120px}
.menu-btn{display:none}
#view{padding:22px;max-width:1100px;width:100%;margin:0 auto}
.overlay{display:none}

/* ===================== COMPONENTS ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-bottom:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;font-size:.95rem}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:200px;resize:vertical;line-height:1.6}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.lv{color:#fff}.lv.A2{background:var(--A2)}.lv.B1{background:var(--B1)}.lv.B2{background:var(--B2)}
.bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s}
.stat{font-size:1.8rem;font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--border);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--text)}
.tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--surface);cursor:pointer}
.list-item:hover{border-color:var(--primary)}
.done-badge{color:var(--ok);font-weight:700;font-size:.85rem}
.vi{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.93rem}
.vi::before{content:"🇻🇳 ";}
body.vi-off .vi{display:none}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.88rem;font-weight:600;user-select:none}
.switch input{width:36px;height:20px;appearance:none;background:var(--border);border-radius:999px;position:relative;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{left:18px}
.notice{padding:12px 14px;border-radius:10px;background:var(--primary-soft);margin:10px 0}
.notice.bad{background:var(--bad-soft)}.notice.ok{background:var(--ok-soft)}.notice.warn{background:var(--warn-soft)}

/* ===================== READING ===================== */
.passage{font-size:1.05rem;line-height:1.8}
.passage p{margin:0 0 .9em}
.passage .plabel{font-weight:800;color:var(--primary);margin-right:6px}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--primary-soft)}
.w.saved{text-decoration:underline dotted var(--primary)}
.popup{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:14px;width:320px;max-width:92vw}
.popup h4{margin:0 0 4px;font-size:1.2rem}

/* ===================== QUIZ ===================== */
.q{padding:12px 0;border-top:1px dashed var(--border)}
.q:first-child{border-top:0}
.q .qt{font-weight:600;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;margin:5px 0;cursor:pointer}
.opt:hover{background:var(--surface2)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.gapin{width:150px;padding:3px 8px;border-radius:6px;margin:0 3px}
.gapin.correct{border-color:var(--ok);background:var(--ok-soft)}
.gapin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:.88rem;margin-top:4px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.ctx{background:var(--surface2);padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:.95rem}
.score-box{font-size:1.15rem;font-weight:800;padding:12px;border-radius:12px;margin-top:10px}
.match-row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
.match-row .ml{min-width:150px;font-weight:600}
.explain{margin-top:8px;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;padding:8px 12px;background:var(--surface2)}
.explain summary{cursor:pointer;font-weight:700;color:var(--primary)}
.explain-body{font-size:.94rem;margin-top:6px}
.explain mark{background:#fde68a;color:#1d2433;border-radius:3px;padding:0 2px}

/* ===================== LISTENING / SPEAKING ===================== */
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--surface2);border-radius:12px;margin-bottom:12px}
.transcript .line{padding:4px 8px;border-radius:6px}
.transcript .line.speaking{background:var(--primary-soft)}
.diff .ok{color:var(--ok);font-weight:600}
.diff .miss{color:var(--bad);text-decoration:underline;font-weight:600}
.diff .extra{color:var(--warn);text-decoration:line-through}
.timer{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.rec-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.picture{font-size:2.6rem;line-height:1.4;text-align:center;background:var(--surface2);border-radius:14px;padding:16px;white-space:pre-line}
.wfb .ok{background:var(--ok-soft);color:var(--ok);padding:1px 4px;border-radius:4px}
.wfb .bad{background:var(--bad-soft);color:var(--bad);padding:1px 4px;border-radius:4px}

/* ===================== ROADMAP ===================== */
.stage{border-left:6px solid var(--c);}
.units{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:12px}
.unit{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface)}
.unit ul{padding-left:18px;margin:6px 0;font-size:.9rem}
.unit li.ok{color:var(--ok)}
.locked{opacity:.65}

/* ===================== FLASHCARDS ===================== */
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,var(--primary-soft),var(--surface));border:1px solid var(--border);border-radius:18px;padding:24px;cursor:pointer}
.flash .word{font-size:2rem;font-weight:800}
.badge{text-align:center;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface)}
.badge .bi{font-size:2rem}
.badge.off{opacity:.35;filter:grayscale(1)}
canvas{width:100%;display:block}
table{border-collapse:collapse;width:100%}
td,th{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;font-size:.93rem;vertical-align:top}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow)}

/* ===================== RESPONSIVE ===================== */
@media (max-width:900px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sidebar{position:fixed;left:-260px;transition:left .25s;height:100vh}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
  .menu-btn{display:inline-flex}
  #view{padding:14px}
}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}.topbar{padding:8px 12px}.gapin{width:110px}}
</style>
</head>

{id:"r-a2-1", title:"My Big Family", topic:"Family",
text:`Hi, I'm Linh and I'm thirteen years old. I live in Hai Phong with my parents, my grandmother and my little brother, Minh. My father is a bus driver and he works long hours. My mother is a nurse at the city hospital. She usually works in the morning, so she cooks dinner for us every evening.

My grandmother is seventy-two, but she is very active. Every morning she walks to the park and does exercise with her friends. She also tells us funny stories about her childhood.

Minh is seven. He loves football and he plays it every afternoon after school. Sometimes he is noisy, but he is kind and he always shares his sweets with me.

At the weekend, my aunt and uncle visit us with my two cousins. We have a big lunch together and then we play games in the living room. I love my big family!`,

{id:"r-a2-2", title:"Our New Flat", topic:"Home",
text:`Last month my family moved to a new flat in the city centre. It is on the eighth floor of a tall building, so we can see the river from our windows. There is a lift, but my dad always takes the stairs because he wants to stay fit.

The flat has three bedrooms, a kitchen, a bathroom and a small balcony. My bedroom is next to the kitchen. It is not very big, but it is bright and I have a desk under the window. I do my homework there every evening.

My favourite place is the balcony. My mum keeps plants and flowers there, and on hot evenings we sit outside and eat fruit together.

The only problem is the noise. The street below is very busy, and I can hear motorbikes until late at night. But I still love our new home.`,
g:{move:["chuyển (nhà)","go to live in a different place"],floor:["tầng","a level of a building"],lift:["thang máy","a machine that carries people up and down"],stairs:["cầu thang","steps for going up or down"],balcony:["ban công","a small area outside a window, above the ground"],fit:["khỏe mạnh","healthy and strong"],bright:["sáng sủa","full of light"]},
q:[
{t:"mc",q:"Where is the new flat?",o:["On the ground floor","On the eighth floor","Next to a school"],a:1},
{t:"tf",q:"The writer's dad uses the lift every day.",a:false},

{t:"tf",q:"The family sits on the balcony on hot evenings.",a:true},
{t:"mc",q:"What is the problem with the flat?",o:["It is too small.","It is noisy.","It is far from the river."],a:1}
]},
{id:"r-a2-3", title:"Tom's Busy Day", topic:"Daily routine",
text:`Tom is a student at a high school in Manchester. On weekdays, he gets up at half past six. First, he has a shower and gets dressed. Then he has breakfast with his sister. He usually eats toast and drinks orange juice.

School starts at quarter to nine. Tom goes there by bike because it is only two kilometres from his house. His favourite subject is science, but he doesn't like history very much.

After school, Tom has a part-time job. He works at a small café on Tuesdays and Thursdays. He washes cups and cleans the tables. He earns some money and saves it for a new laptop.

In the evening, Tom does his homework and chats with his friends online. He never goes to bed before eleven o'clock, so he is often tired in the morning!`,

q:[
{t:"mc",q:"What time does Tom get up on weekdays?",o:["6.00","6.30","8.45"],a:1},
{t:"mc",q:"How does Tom go to school?",o:["By bus","On foot","By bike"],a:2},
{t:"tf",q:"Tom loves history.",a:false},
{t:"gap",q:"Tom works at a café on Tuesdays and ___.",a:"thursdays"},
{t:"mc",q:"Why does Tom save money?",o:["For a holiday","For a new laptop","For a new bike"],a:1},
{t:"tf",q:"Tom goes to bed early.",a:false}
]},
{id:"r-a2-4", title:"A Day at the Bakery", topic:"Work and routine",
text:`Mrs Hoa has a small bakery on Le Loi Street. Her day starts very early. She gets up at four o'clock every morning, when the streets are still dark and quiet. At half past four, she starts making bread. She makes about two hundred loaves every day.

The bakery opens at six. Many customers buy bread on their way to work or school. Mrs Hoa's daughter, Mai, helps in the shop before she goes to university. She takes the money and puts the bread in paper bags.

In the afternoon, the shop is quieter. Mrs Hoa cleans the kitchen and orders flour and eggs for the next day. She also makes cakes for birthdays and weddings. Her chocolate cake is very popular.

{t:"mc",q:"How many loaves does she make every day?",o:["About 100","About 200","About 400"],a:1},

{t:"gap",q:"In the afternoon, Mrs Hoa orders flour and ___ for the next day.",a:"eggs"},
{t:"mc",q:"What is very popular?",o:["Her bread rolls","Her chocolate cake","Her coffee"],a:1},
{t:"tf",q:"The bakery closes at six in the evening.",a:false}
]},
{id:"r-a2-5", title:"The Saturday Market", topic:"Shopping",
text:`Every Saturday morning, Lan goes to the market near her house with her grandmother. The market is open from six until eleven, and it is always busy and colourful.

{t:"gap",q:"The fish seller often gives Lan's grandmother a small ___.",a:"discount"},
{t:"tf",q:"They have noodle soup at a restaurant in the city centre.",a:false},
{t:"mc",q:"Why does Lan prefer the market?",o:["It is cheaper.","The sellers are friendly.","It is open all day."],a:1}
]},
{id:"r-a2-6", title:"What's in Your Lunch Box?", topic:"Food",
text:`At Green Hill School, students can buy lunch in the canteen or bring a lunch box from home. We asked three students about their lunch.

{id:"r-b1-1", title:"My First Job Interview", topic:"Work",
text:`When I was nineteen, I applied for a summer job at a hotel by the sea. I had never had a job interview before, so I was extremely nervous. The night before, I couldn't sleep at all.

I had prepared carefully. I had read about the hotel on its website, and my older sister had asked me some typical interview questions, such as "Why do you want this job?" and "What are your strengths?". I had also chosen my clothes: a simple white shirt and dark trousers.

On the day of the interview, I left home early, but the bus broke down halfway, and I had to walk the last two kilometres in the rain. I arrived ten minutes late, wet and embarrassed. I was sure I had already lost my chance.

However, the manager, a friendly woman called Mrs Patel, just smiled and gave me a towel. She asked me about my studies, my hobbies and how I dealt with difficult situations. I told her the truth about the bus and the walk in the rain. To my surprise, she said that this showed I didn't give up easily.

A week later, she phoned me and offered me the job. I worked at the reception desk all summer, and it was one of the best experiences of my life. I improved my English because many guests came from abroad, and I learned how to stay calm when things go wrong.

Since then, I have had several interviews, and I have always remembered that summer. My advice? Prepare well, be honest, and don't panic if something unexpected happens. Sometimes a problem can become an opportunity.`,

{id:"r-b1-2", title:"Online Learning: Is It Right for You?", topic:"School",
text:`Ten years ago, most people studied in a classroom with a teacher in front of them. Today, millions of students all over the world take courses online, from language lessons to university degrees. But is online learning right for everyone?

One big advantage is flexibility. You can study at any time and in any place, as long as you have an internet connection. This is very useful for people who have a job or a family. Students can also watch recorded lessons again if they didn't understand something the first time.

Another advantage is cost. Online courses are often cheaper than traditional ones, and students save money on transport and accommodation. Some excellent courses are even free.

However, online learning also has disadvantages. Many students find it hard to stay motivated without a teacher or classmates around them. It is easy to put off studying when nobody is checking your progress. In fact, a large number of people who start free online courses never finish them.

Another problem is the lack of social contact. In a real classroom, you can chat with other students, ask questions immediately and work in groups. Online, you may feel lonely, especially if the course has no live lessons.

So how can you succeed as an online learner? Experts suggest making a timetable and studying at the same time every day. It also helps to find a study partner, join an online discussion group and set small goals, for example finishing one unit a week. Finally, choose a quiet place to study and turn off your phone notifications.

Online learning is not easier than classroom learning; it is simply different. If you are organised and motivated, it can open many doors.`,

{id:"r-b1-3", title:"Why Teenagers Need More Sleep", topic:"Health",
text:`Many parents complain that their teenage children stay up late and are impossible to wake up in the morning. They often think teenagers are just lazy. But scientists say there is a biological reason for this behaviour.

During the teenage years, the body's internal clock changes. The brain starts producing melatonin, the hormone that makes us feel sleepy, about two hours later than in children or adults. As a result, many teenagers don't feel tired until eleven o'clock or even midnight. However, they still have to get up early for school, so they often sleep only six or seven hours a night.

Doctors recommend that teenagers sleep between eight and ten hours. When they don't get enough sleep, they may find it difficult to concentrate in class, and their memory gets worse. Lack of sleep can also affect their mood, making them more stressed or angry. Some studies have even linked poor sleep with a higher risk of illness and accidents.

Technology makes the problem worse. Many young people use their phones in bed, and the blue light from screens tells the brain that it is still daytime. Messages and social media also keep the mind active when it should be relaxing.

What can be done? Some schools in the USA and the UK have started lessons later, at around nine or half past nine. Teachers at these schools report that students are more awake and attentive, and some schools have seen better exam results.

Teenagers can also help themselves. Experts suggest keeping phones out of the bedroom, avoiding coffee and energy drinks in the evening, and going to bed at the same time every night, even at weekends. Sleep, they say, is not a waste of time; it is one of the best ways to stay healthy and do well at school.`,

{id:"r-b1-4", title:"Walking Meetings", topic:"Health at work",
text:`In many offices, people spend most of the day sitting down: at their desks, in meetings and even during lunch. Doctors warn that sitting for long periods is bad for our health. It can lead to back pain, weight gain and heart problems. So some companies are trying a simple idea: walking meetings.

Instead of sitting around a table, two or three colleagues go for a walk while they discuss their work. The meeting might take place in a park near the office or simply along the street. Most walking meetings last between twenty and forty minutes.

Daniel Reyes, a manager at a software company in Toronto, started holding walking meetings two years ago. "At first my team thought it was a strange idea," he says. "But now they love it. People seem more relaxed and honest when they are walking side by side. And we often come back with better ideas."

Research supports his experience. A study at a university in California found that people had more creative ideas while walking than while sitting. Walking also gives workers a break from their screens and a chance to get some fresh air.

Of course, walking meetings are not right for every situation. They don't work well for large groups, or when people need to look at documents or take detailed notes. Bad weather can also be a problem, especially in winter. And some people may find it hard to walk long distances.

Experts suggest starting with short one-to-one meetings and planning a simple route in advance. It is also a good idea to tell colleagues beforehand so they can wear comfortable shoes. Even a short walk once a day can make a real difference to how we feel at work.`,

{id:"r-b1-5", title:"A Week Without My Phone", topic:"Technology",
text:`Last month, my teacher challenged our class to live without smartphones for one week. Most of my classmates laughed, but twelve of us agreed to try. I was one of them, although I wasn't sure I would succeed. I usually spend about five hours a day on my phone.

The first two days were really difficult. I kept reaching into my pocket to check messages, even though my phone was locked in a drawer at home. I felt anxious because I thought I was missing important news from my friends. I also realised how often I used my phone for simple things: checking the time, the weather and the bus timetable. I had to buy a cheap watch and ask people for directions!

By the third day, however, something changed. I started noticing things around me. On the bus, I looked out of the window instead of at a screen, and I discovered a small bookshop near my school that I had never seen before. In the evenings, I finished my homework much faster because nothing interrupted me. I even started reading a novel, which I hadn't done for years.

The biggest surprise was sleep. Without my phone in bed, I fell asleep earlier and woke up feeling more rested.

Of course, there were some problems. I missed a party because I didn't see the invitation in our group chat, and my mum got worried when she couldn't contact me after school.

When the week finished, I was happy to get my phone back. But I have changed some habits. I now leave my phone outside my bedroom at night, and I have deleted two social media apps. I still use my phone every day, but now I feel that I control it, not the other way round.`,

{id:"r-b1-6", title:"Is Your Home Smart?", topic:"Technology",
text:`Imagine coming home on a cold evening. Before you arrive, the heating has already turned on. As you open the door, the lights switch on and your favourite music starts playing. This is not science fiction; it is a smart home, and more and more people are living in one.

A smart home uses devices that are connected to the internet. You can control them with an app on your phone or with your voice, using a smart speaker. Popular devices include smart lights, heating systems, security cameras, door locks and even fridges that tell you when you need to buy more milk.

Supporters say smart homes make life easier and safer. For example, if you forget to turn off the lights, you can do it from your office. Parents can check a camera to see if their children have arrived home from school. Smart heating can also save energy, because it only heats rooms when people are using them. For older people or people with disabilities, voice control can be especially helpful.

However, not everyone is convinced. Smart devices can be expensive, and they sometimes stop working when the internet connection is down. The biggest worry for many people is privacy. Smart speakers are always listening for their "wake word", and some users are not comfortable with a device that might record their conversations. There have also been cases of hackers getting into home cameras.

Experts advise people who want a smart home to start with one or two devices, buy from well-known companies, and change the default passwords immediately. It is also important to update the software regularly.

So, is a smart home a good idea? It depends on your needs, your budget and how much you trust technology.`,

{id:"r-b1-7", title:"Lost in the Old Quarter", topic:"Experiences",
text:`Two years ago, I travelled to Vietnam on my own for the first time. On my second evening in Hanoi, I decided to explore the Old Quarter without a map. I wanted to feel like a real traveller, not a tourist following a guidebook.

At first everything was wonderful. The narrow streets were full of motorbikes, street food stalls and shops selling everything from silk to shoes. I bought a bowl of bun cha and sat on a tiny plastic chair, watching the busy world go by. While I was eating, it started to get dark.

When I tried to go back to my hotel, I realised I had no idea where I was. All the streets looked similar, and my phone battery was almost dead. I walked for half an hour, but I only got more lost. I was beginning to feel worried.

Then I noticed an old man who was sitting outside a small shop, drinking tea. I showed him the hotel's business card. He didn't speak English and I didn't speak Vietnamese, but he smiled, closed his shop and gestured for me to follow him. We walked together for about fifteen minutes through streets I had never seen. When we reached my hotel, he simply waved and walked away before I could even thank him properly.

I have travelled to many countries since then, but that evening is still one of my favourite memories. It taught me two things. First, always carry a fully charged phone or a paper map! Second, and more importantly, kindness doesn't need a common language. Whenever I see a lost tourist in my own city now, I try to help them, just like that old man helped me.`,

{id:"r-b1-8", title:"Volunteering at an Animal Shelter", topic:"Experiences",
text:`Every Saturday morning, while most of her friends are still asleep, seventeen-year-old Chloe takes the bus to the Hope Animal Shelter on the edge of town. She has been volunteering there for eighteen months.

The shelter looks after dogs and cats that have been abandoned or lost. At any time, it has about forty dogs and twenty-five cats. It is run by four paid staff and a team of around thirty volunteers, mostly students and retired people.

Chloe's tasks vary. She cleans the cages, prepares food and takes the dogs for walks. "Walking the dogs is my favourite part," she says. "Some of them are very scared when they arrive, because they have had a hard life. It's amazing when a dog that was afraid of people starts to trust you."

The work isn't always easy. Cleaning can be dirty and tiring, and it can be sad when an animal is ill. But Chloe says she has gained a lot from the experience. She has become more patient and responsible, and she has made new friends of all ages. She has also decided what she wants to do in the future: she is planning to study veterinary medicine at university.

The shelter's manager, Ruth Adams, says volunteers are essential. "Without them, we simply couldn't care for so many animals," she explains. "We don't need people with special skills. We need people who are reliable and who love animals."

If you are interested in volunteering, the shelter asks you to come for a short training session first. Volunteers must be at least sixteen, and they are asked to give a minimum of three hours a week.`,

{id:"r-b1-9", title:"My Gap Year Plan", topic:"Plans",
text:`Next June I'm going to finish secondary school, and I've decided to take a gap year before I start university. A gap year is a year when you take a break from education to travel, work or volunteer. My parents weren't very happy about the idea at first. They were worried that I would lose interest in studying. But after I showed them my plan, they agreed.

For the first three months, I'm going to work full-time in a supermarket near my home. I want to save as much money as possible for the rest of the year. I'm also going to do an online first-aid course, which I think will be useful when I travel.

In October, I'm flying to Australia. I've applied for a working holiday visa, which allows young people to work there for up to a year. I'm hoping to find a job on a farm, picking fruit, because I've heard it's a good way to meet people and earn money at the same time.

After that, if I have enough money, I'd like to spend two months travelling around Southeast Asia. I'm especially excited about visiting Vietnam and Thailand. I'm going to stay in cheap hostels and travel by bus and train.

I'll come back home in August, just before university starts. I'm going to study engineering, and I hope the experience will make me more independent and confident.

Of course, a gap year isn't for everyone. It can be expensive, and some students find it hard to go back to studying. But I believe that if you plan carefully and have clear goals, it can be one of the most valuable experiences of your life.`,

{id:"r-b1-10", title:"Starting Again at Forty", topic:"Work and plans",
text:`For fifteen years, Marta Silva worked as an accountant in a large bank in Lisbon. She had a good salary and a comfortable life, but she wasn't happy. "Every Monday morning I felt tired before the week had even started," she remembers. "I was good at my job, but I didn't enjoy it."

Marta had always loved cooking. At weekends, she baked bread and cakes for her friends, and they often told her that she should open her own café. For years she thought it was just a dream. Then, when she turned forty, she decided it was now or never.

She didn't leave the bank immediately. First, she took evening classes at a cooking school for a year. Then she worked part-time in a friend's restaurant at weekends to learn how a food business really works. "I learned that running a café isn't only about food," she says. "You have to deal with suppliers, staff, money and customers who are sometimes difficult."

Finally, after saving money for two years, she resigned from her job and opened a small café near the university. The first year was very hard. She worked twelve hours a day, six days a week, and she earned much less than before. There were months when she wasn't sure the business would survive.

Today, three years later, the café is popular with students and local workers, and Marta employs four people. "I'm busier than I've ever been, but I'm much happier," she says. "My advice to anyone who wants to change career is: don't wait for the perfect moment, because it never comes. But do prepare carefully and be realistic about the difficulties."`,

{id:"r-b2-1", title:"The Hidden Cost of Fast Fashion", topic:"Environment",
text:`Walk into any high-street clothing store and you will find T-shirts that cost less than a sandwich. Over the past two decades, the fashion industry has transformed itself. Instead of releasing two collections a year, many brands now introduce new designs every few weeks, and shoppers have come to expect constant novelty. This model, known as "fast fashion", has made trendy clothes affordable for millions of people. Yet behind the low prices lies a considerable environmental cost.

Producing clothes requires enormous amounts of resources. Cotton, one of the most widely used fibres, is an extremely thirsty crop: growing enough to make a single pair of jeans can consume several thousand litres of water. Synthetic fabrics such as polyester, on the other hand, are made from oil, and every time they are washed, they release tiny plastic fibres that eventually end up in rivers and oceans. Dyeing and finishing processes add chemicals that, in countries with weak regulations, are often poured directly into local waterways.

The problem does not end when clothes leave the factory. Because they are so cheap, many garments are worn only a handful of times before being thrown away. Studies suggest that the average consumer buys far more clothing than twenty years ago, but keeps each item for roughly half as long. The vast majority of unwanted clothes are either burned or sent to landfill, and only a tiny percentage is recycled into new garments. In some developing countries, mountains of second-hand clothing shipped from wealthier nations have become a serious waste problem in their own right.

Some companies have responded to growing public concern by launching "sustainable" or "eco-friendly" collections. Critics argue, however, that many of these initiatives amount to little more than marketing, a practice often called greenwashing. A brand that sells a few items made from recycled materials while continuing to produce millions of cheap garments every month is hardly solving the problem. Genuine progress, they say, would mean producing fewer garments, not simply adding a green label to a small part of the range.

So what can individuals do? Experts point out that the most sustainable garment is the one already in your wardrobe. Buying fewer, better-quality items, repairing clothes instead of replacing them, and shopping second-hand can all reduce our impact. Clothing swaps and rental services are also becoming increasingly popular, particularly among young people. Ultimately, though, many campaigners believe that lasting change will require stricter laws that hold manufacturers responsible for the entire life cycle of their products.`,

{id:"r-b2-2", title:"Rewilding: Letting Nature Take Back Control", topic:"Environment",
text:`For centuries, humans have shaped the landscape to suit their needs, clearing forests for farmland, draining wetlands and hunting large animals until they disappeared. Today, a growing movement is attempting something radically different. Known as rewilding, it aims to restore ecosystems by allowing natural processes to take over again, with as little human management as possible.

Unlike traditional conservation, which often focuses on protecting a particular species or carefully maintaining a habitat, rewilding takes a more hands-off approach. The idea is to repair the basic conditions for nature, for example by removing dams or reintroducing missing animals, and then step back. Supporters argue that ecosystems are far better at managing themselves than we are. In their view, nature has been recovering from disturbances for millions of years, and our role should be to remove the obstacles rather than to control every detail.

One of the most famous examples comes from Yellowstone National Park in the United States. Wolves had been eliminated from the park by the 1920s, and without them, the population of elk grew rapidly. The elk ate young trees along the rivers, which in turn led to riverbank erosion. When wolves were reintroduced in 1995, elk numbers fell and their behaviour changed. Trees began to recover, and with them came birds, beavers and fish. Scientists still debate how much of this change was caused by the wolves alone, but the case has become a powerful symbol of what rewilding might achieve.

In Europe, rewilding projects range from returning beavers to British rivers to allowing abandoned farmland in Spain and Portugal to turn back into forest. In the Netherlands, a controversial reserve called Oostvaardersplassen introduced large grazing animals such as deer and wild horses. However, during harsh winters, many of the animals starved, sparking public anger and a heated discussion about whether humans should intervene.

This highlights one of the main criticisms of rewilding. Farmers worry that predators such as wolves and lynx will attack their livestock, and some rural communities feel that decisions are being made by city-dwelling environmentalists who do not depend on the land for their living. Others question whether it is realistic to recreate "wild" landscapes in densely populated countries.

Despite these concerns, interest in rewilding continues to grow. Advocates point out that healthy ecosystems store carbon, reduce flooding and support tourism, bringing economic benefits to rural areas. Many now argue that the most successful projects are those that involve local people from the beginning, combining ecological goals with the needs of the communities who live alongside them.`,

{id:"r-b2-3", title:"The Loneliness Epidemic", topic:"Society",
text:`It may seem strange that in an age when we can contact almost anyone in the world instantly, more people than ever report feeling lonely. Yet surveys in many countries suggest exactly that. In the United Kingdom, the problem was considered so serious that in 2018 the government appointed a Minister for Loneliness, the first position of its kind in the world.

Loneliness is not the same as being alone. Many people enjoy spending time by themselves, while others feel isolated even when surrounded by friends and family. Psychologists define loneliness as the gap between the social connections we have and the ones we would like to have. It is, in other words, a subjective feeling rather than an objective situation.

Traditionally, loneliness was seen as a problem mainly affecting older people, particularly those who have lost a partner or live far from their families. While this group remains vulnerable, recent research has produced a surprising finding: young adults aged between sixteen and twenty-four often report the highest levels of loneliness of any age group. Possible explanations include moving away from home for study or work, the pressure to appear successful on social media, and a decline in community activities that once brought people together.

The consequences are more serious than many people realise. Chronic loneliness has been linked to depression, anxiety, poor sleep and even heart disease. Some researchers have claimed that its impact on life expectancy is comparable to that of smoking, although this comparison remains a subject of debate. What is clear is that humans are social creatures, and long periods of isolation affect both mental and physical health.

Various solutions are being tried. Some doctors now practise "social prescribing", referring lonely patients to local groups such as gardening clubs, walking groups or choirs instead of, or as well as, prescribing medication. Intergenerational projects, in which students share housing with elderly people or visit care homes, have shown promising results for both age groups. Technology, often blamed for the problem, can also be part of the solution: online communities help people with rare illnesses or specific interests find others like them.

Ultimately, however, experts emphasise that tackling loneliness cannot be left to governments alone. Small actions, such as chatting with a neighbour, inviting a new colleague to lunch or simply making a phone call, can make a significant difference. Loneliness, they argue, is not a personal failure but a shared social challenge.`,

{id:"r-b2-4", title:"Should City Centres Be Car-Free?", topic:"Society (opinion)",
text:`From Oslo to Madrid, a number of European cities have taken bold steps to reduce or even ban private cars in their historic centres. Supporters see this as an essential move towards cleaner, safer and more liveable cities. Opponents, on the other hand, warn of damage to businesses and inconvenience for residents. As more cities around the world consider similar policies, the debate is becoming increasingly heated.

The most obvious argument in favour of car-free centres concerns air quality. Road traffic is a major source of nitrogen dioxide and fine particles, pollutants associated with asthma, heart disease and other serious conditions. When Madrid restricted traffic in its central district, monitoring stations recorded a significant drop in pollution within months. Reducing traffic also cuts noise, which is increasingly recognised as a health hazard in its own right.

Safety is another key consideration. Fewer cars mean fewer accidents, and streets become more welcoming for pedestrians, cyclists and children. In Oslo, which removed most parking spaces from its centre and replaced them with benches, bike lanes and small parks, the number of pedestrian deaths fell dramatically. Many residents say the city simply feels more pleasant to walk around. Local cafés have also gained space for outdoor tables, which has made the streets livelier in the evenings.

Critics, however, raise legitimate concerns. Shop owners frequently fear that customers who can no longer drive into the centre will shop elsewhere, for example in out-of-town shopping malls. Elderly and disabled people, who may depend on cars, can find it harder to reach essential services. There is also a risk that traffic is simply pushed into surrounding neighbourhoods, where it causes congestion and pollution for people who may be less able to complain.

Evidence suggests that the economic fears are often exaggerated. Studies in several cities have found that pedestrians and cyclists tend to visit local shops more frequently than drivers, even if they spend less on each visit, and that footfall often rises once streets become more attractive. Nevertheless, the transition can be difficult, and some small businesses do struggle during the early stages.

In my view, the benefits of car-free centres clearly outweigh the drawbacks, but only if such schemes are carefully designed. Cities need to invest in reliable, affordable public transport before restricting cars, provide exceptions for disabled drivers and deliveries, and consult local businesses throughout the process. A car-free centre should not be imposed overnight; it should be built together with the people who live and work there.`,

{id:"r-b2-5", title:"News in the Age of the Algorithm", topic:"Media",
text:`Not long ago, most people got their news from a handful of sources: a morning newspaper, the radio or the evening television bulletin. Editors decided which stories were important, and everyone saw more or less the same headlines. Today, a growing proportion of people, especially under the age of thirty-five, encounter news mainly through social media feeds, video platforms and news aggregator apps. This shift has transformed not only how we consume information, but also what we consume.

On social media, what appears on your screen is largely determined by algorithms: sets of rules that predict what content will keep you engaged. These algorithms learn from your behaviour: what you click, share, comment on and how long you spend looking at something. The result is a highly personalised feed. On the positive side, this means people can easily follow topics that genuinely interest them, from local politics to climate science, and discover voices that traditional media might have ignored.

However, critics argue that personalisation comes at a price. Because algorithms tend to prioritise content that provokes strong reactions, sensational or emotionally charged stories often spread faster than careful, balanced reporting. Some researchers have also warned of "filter bubbles", in which users are mainly exposed to views that confirm what they already believe. While the extent of this effect is disputed, it raises concerns about increasing polarisation in society.

The speed of social media has created another challenge: misinformation. False or misleading stories can reach millions of people before journalists or fact-checkers have had time to investigate. During elections and public health emergencies, such content can have real consequences. Platforms have introduced measures such as warning labels and partnerships with fact-checking organisations, but many experts believe these efforts remain insufficient.

Traditional news organisations, meanwhile, face their own difficulties. As advertising revenue has moved online, many local newspapers have closed, leaving some communities with little independent coverage of local issues. Some publishers have responded by introducing paywalls, asking readers to pay for quality journalism, while others rely on donations or public funding.

What does this mean for ordinary readers? Media literacy, the ability to evaluate sources critically, is becoming an essential skill. Checking who is behind a story, looking for the original source, comparing several outlets and being aware of our own biases can help us navigate a complex information landscape. In the end, algorithms may shape what we see, but we still have a choice about what we believe.`,

{id:"r-b2-6", title:"The Influencer Economy", topic:"Media",
text:`Ask a group of teenagers what they want to be when they grow up, and a surprising number will answer: "an influencer". Over the past decade, people who build large followings on platforms such as Instagram, YouTube and TikTok have become some of the most powerful figures in marketing. Brands now spend billions of dollars every year paying them to promote products, from cosmetics to cars.

The appeal for companies is easy to understand. Traditional advertising is increasingly ignored; many viewers skip adverts or use ad-blocking software. Influencers, by contrast, often have a close and trusting relationship with their audience. When a creator that people have followed for years recommends a product, it can feel more like advice from a friend than a sales pitch. Interestingly, so-called micro-influencers, with between ten thousand and one hundred thousand followers, often achieve higher engagement rates than celebrities with millions.

For the influencers themselves, the reality is often less glamorous than it appears. Only a small minority earn enough to make a living. Producing content consistently is time-consuming and stressful, and income can disappear overnight if a platform changes its algorithm or a brand ends a partnership. Many creators report burnout, anxiety and pressure to share ever more of their private lives in order to stay relevant.

The influencer industry has also raised ethical questions. In the past, some influencers promoted products without making it clear that they were being paid, which misled their followers. Many countries have since introduced rules requiring sponsored posts to be clearly labelled, although enforcement is inconsistent. There is particular concern about younger audiences, who may find it difficult to distinguish between genuine opinions and advertising. Critics also argue that the carefully edited images common on social media can promote unrealistic standards of beauty and lifestyle.

Not all influence is commercial, however. Some creators use their platforms to educate, raising awareness of issues such as mental health, environmental protection or financial literacy. Teachers, doctors and scientists have found large audiences by explaining complex topics in accessible ways. In this sense, the line between entertainment, education and marketing is becoming increasingly blurred.

Whether we see influencers as a positive or negative force probably depends on how we engage with them. Following creators critically, noticing when content is sponsored and remembering that online lives are often carefully curated can help us enjoy what social media offers without being unduly influenced by it.`,

{id:"r-b2-7", title:"Exams: Measuring Learning or Getting in the Way?", topic:"Education",
text:`Every year, millions of students around the world sit high-stakes exams that can determine which university they attend and, in some cases, the direction of their entire career. In Vietnam, the national high school graduation exam is a major event; in South Korea, flights are rescheduled so that aircraft noise does not disturb students during the English listening test. Yet despite their importance, exams remain one of the most debated aspects of education.

Defenders of traditional examinations point to their fairness. A standardised test, taken by all students under the same conditions and marked anonymously, offers a relatively objective way to compare candidates from different schools and backgrounds. Without such tests, they argue, university admissions might depend more heavily on personal connections or on the reputation of a student's school, which could disadvantage those from less privileged communities. In many countries, a national exam is also seen as one of the few ways in which a talented student from a poor rural area can compete equally with wealthier peers.

Critics, however, argue that exams measure only a narrow range of abilities. Skills such as creativity, teamwork, critical thinking and practical problem-solving are difficult to assess in a timed written paper. Moreover, when results carry enormous consequences, teachers may feel pressure to "teach to the test", focusing on exam techniques rather than deep understanding. Students, in turn, may learn to memorise information for a few hours rather than to genuinely engage with ideas.

There are also concerns about well-being. Surveys in several countries have linked intense exam pressure with anxiety, sleep problems and, in extreme cases, more serious mental health difficulties. Some students perform poorly not because they lack knowledge but because stress affects them on the day itself. Others become so focused on grades that they lose their natural curiosity about learning.

In response, some education systems have experimented with alternatives. Finland, often praised for its schools, has very few standardised tests before the end of secondary education, relying instead on teacher assessment. Other countries have introduced a mix of coursework, projects and oral presentations alongside written exams, so that a single bad day does not decide a student's future.

Perhaps the real question is not whether we should have exams, but what role they should play. Used wisely, as one source of information among several, tests can motivate students and provide valuable feedback. The danger arises when a single score becomes the only measure that matters. It is a balance that every education system has to find for itself.`,

{id:"r-b2-8", title:"Is It Ever Too Late to Learn a Language?", topic:"Education",
text:`It is a widely held belief that children are naturally better language learners than adults. Most of us know someone who moved abroad as a child and now speaks the local language like a native, while their parents still struggle after decades. But is age really the deciding factor, and does this mean adults should give up?

Research does support part of the common view. Studies of immigrants have found that people who start learning a language in early childhood are far more likely to achieve a native-like accent than those who begin as teenagers or adults. Some scientists have linked this to a "critical period" during which the brain is especially sensitive to the sounds of language. A large study published in 2018, which analysed online grammar quiz results from hundreds of thousands of people, suggested that the ability to master grammar to a native level declines after around the age of seventeen.

However, this is only part of the story. Being able to reach native-like perfection is not the same as being able to learn a language well. In fact, when it comes to the early stages of learning, adults and older teenagers often make faster progress than young children. They have more developed memory strategies, a better understanding of how grammar works and, crucially, the ability to study deliberately. A motivated adult can reach a high level of communicative ability within a few years.

Children's apparent advantage also has a lot to do with their environment. A child who moves to a new country typically spends hours every day at school, surrounded by native speakers and with a strong social need to fit in. Adults, on the other hand, often learn in a classroom for a few hours a week, while continuing to use their first language at work and at home. When adults are given comparable exposure, the gap narrows considerably.

There are also benefits to learning later in life that go beyond communication. Several studies have suggested that bilingualism may help to keep the brain active and could delay the onset of dementia by several years, although researchers are still investigating the exact relationship. Learning a language also opens doors to new cultures, friendships and career opportunities at any age.

So, rather than worrying about lost time, adult learners might focus on what really makes a difference: regular practice, meaningful exposure to the language and realistic goals. A perfect accent may be out of reach, but clear, confident communication certainly is not.`,

{id:"r-b2-9", title:"The Science of Habits", topic:"Science",
text:`Researchers estimate that a large proportion of our daily actions, perhaps as much as forty per cent, are not the result of conscious decisions but of habits. From the way we brush our teeth to the route we take to work, much of our behaviour runs on autopilot. This is not necessarily a bad thing; habits allow us to complete routine tasks quickly while our minds are busy with other things. Understanding how habits form can help us replace bad ones with better ones.

Habits develop through a process that scientists often describe as a loop. First, there is a cue, a trigger that tells the brain to start a particular behaviour, such as feeling bored or arriving home. Then comes the routine, the behaviour itself, for example checking your phone or eating a snack. Finally, there is a reward, something pleasant that the brain remembers. Each time the loop is repeated, the connection between cue and routine becomes stronger, until the behaviour happens almost automatically.

This process is closely linked to a region deep in the brain called the basal ganglia, which plays a central role in forming routines. As a behaviour becomes habitual, activity in the parts of the brain responsible for decision-making decreases. This is efficient, since it frees up mental energy for other tasks, but it also explains why habits are so hard to break: we often perform them without thinking at all. It also explains why simply deciding to change is rarely enough; the old routine is still stored in the brain, ready to be triggered by the familiar cue.

Contrary to the popular claim that it takes twenty-one days to form a new habit, research suggests the process usually takes much longer. In one well-known study at University College London, participants took anywhere from eighteen to over two hundred days to make a new behaviour automatic, with an average of around sixty-six days. Encouragingly, missing a single day did not seem to affect the overall process significantly.

So how can we use this knowledge? Experts recommend making desired habits as easy as possible and unwanted habits more difficult. Linking a new behaviour to an existing cue, for example doing ten minutes of vocabulary review straight after breakfast, can help. Rather than trying to remove a bad habit completely, it is often more effective to keep the same cue and reward but change the routine. Above all, patience is essential: lasting change rarely happens overnight.`,

{id:"r-b2-10", title:"Lab-grown Meat: Food of the Future?", topic:"Science",
text:`In 2013, a scientist in the Netherlands presented the world's first burger grown in a laboratory. Made from cells taken from a living cow, it had cost more than 250,000 euros to produce. A decade later, several companies around the world were racing to bring "cultivated meat" to supermarket shelves, and a small number of restaurants had already begun serving it. Supporters claim it could transform the way we feed the planet; sceptics are not so sure.

The basic process involves taking a small sample of cells from an animal and placing them in a nutrient-rich liquid inside large steel tanks called bioreactors. The cells multiply, eventually forming muscle and fat tissue that can be processed into products such as burgers, nuggets or sausages. Crucially, no animal needs to be slaughtered.

The potential advantages are considerable. Livestock farming is responsible for a significant share of global greenhouse gas emissions and uses vast areas of land, contributing to deforestation. Supporters argue that cultivated meat could dramatically reduce these impacts while also ending the suffering of billions of animals raised in industrial farms. It could also reduce the risk of diseases passing from animals to humans and limit the overuse of antibiotics in agriculture.

Nevertheless, significant obstacles remain. Producing cultivated meat on a large scale is technically challenging and still far more expensive than conventional meat. Moreover, the environmental benefits depend heavily on the energy used to power bioreactors; if that energy comes from fossil fuels, the carbon footprint could be higher than expected. Some studies have even suggested that, under certain conditions, cultivated beef might have a larger climate impact than some forms of traditional farming.

Consumer acceptance is another uncertain factor. Surveys show that many people are curious about trying lab-grown meat, but a considerable number describe it as "unnatural" and say they would not eat it regularly. Farmers' organisations in several countries have campaigned against it, and a few governments have even introduced bans, arguing that it threatens traditional agriculture and food culture.

Meanwhile, plant-based alternatives made from ingredients such as soy, peas and mushrooms are already widely available and considerably cheaper. Some experts believe that a combination of approaches, including eating less meat overall, improving farming practices and developing new technologies, will be necessary to make our food system sustainable.

Whether cultivated meat becomes an everyday product or remains a niche curiosity will depend on science, economics and, above all, on the choices of ordinary consumers.`,

q:[{t:"mc",q:"When does the food festival end?",o:["6 p.m.","8 p.m.","10 p.m."],a:1},{t:"mc",q:"Why should people bring cash?",o:["There is an entry fee.","Not all stalls accept cards.","For parking."],a:1},{t:"mc",q:"Where does the half marathon start?",o:["In Central Park","Outside the town hall","At the museum"],a:1},{t:"mc",q:"What do you need to do for the robot workshops?",o:["Nothing, just arrive","Book online in advance","Pay at the door"],a:1}],
gap:"There will be more than [fifty|50] stalls. Expect road [closures] in the city centre. There's a good chance of [rain] on Sunday afternoon.",
dict:"Children can build and program their own robots in free workshops."}
];

DATA.listening.B2 = [
{id:"l-b2-1", title:"Plastic Packaging: Who Is Responsible?", type:"Discussion", speakers:{A:"Host",B:"Dr Lewis",C:"Karen Wu"},
lines:[["A","Today we're discussing plastic packaging in supermarkets. With me are Dr Daniel Lewis, an environmental researcher, and Karen Wu, who runs a chain of grocery stores. Daniel, how serious is the problem?"],["B","It's very serious. Around half of all plastic produced is designed to be used just once, and packaging is the largest part of that. Only a small fraction is actually recycled. We're finding microplastics everywhere, from the deep ocean to human blood."],["A","Karen, as a retailer, do you accept that supermarkets are part of the problem?"],["C","To some extent, yes. But packaging isn't there just for fun. It protects food, keeps it fresh for longer and reduces food waste, which also has a huge environmental impact. A cucumber wrapped in plastic can last several days longer than one without."],["B","That's true in some cases, but a lot of packaging has nothing to do with freshness. Think of bananas in plastic bags, or apples on plastic trays. Those are mainly about presentation and convenience."],["C","I agree that there's unnecessary packaging, and we've removed quite a lot in our stores. Customers can now bring their own containers for things like rice and nuts. But not all customers are willing to change their habits, especially if it's less convenient."],["A","So whose responsibility is it? Shops, customers or governments?"],["B","All three, but I'd argue governments need to lead. Voluntary action has been far too slow. Taxes on single-use plastic or making manufacturers pay for recycling create a level playing field."],["C","I'd support clear rules, as long as they're introduced gradually and businesses get time to adapt. Small shops like mine can't afford to change everything overnight."]],
q:[{t:"mc",q:"Who is Karen Wu?",o:["An environmental researcher","The owner of grocery stores","A government minister"],a:1},{t:"mc",q:"What is Karen's main argument for packaging?",o:["It is cheap.","It reduces food waste.","Customers like it."],a:1},{t:"mc",q:"Which example of unnecessary packaging does Daniel give?",o:["Wrapped cucumbers","Bananas in plastic bags","Rice in containers"],a:1},{t:"mc",q:"What is Karen's view on government rules?",o:["She opposes them.","She supports them if introduced gradually.","She wants them immediately."],a:1}],
gap:"Around half of all plastic produced is designed to be used just [once]. We're finding [microplastics] everywhere. Voluntary action has been far too [slow].",
dict:"Packaging protects food, keeps it fresh for longer and reduces food waste."},
{id:"l-b2-2", title:"Remote Work and the Future of Cities", type:"Talk", speakers:{A:"Lecturer"},
lines:[["A","Before 2020, working from home was a privilege enjoyed by a relatively small number of employees. Then, almost overnight, millions of office workers found themselves holding meetings from their kitchens. Several years later, many companies have adopted hybrid models, with staff splitting their week between home and the workplace."],["A","This shift has consequences that go far beyond individual workers. Business districts that were once crowded from Monday to Friday now see far fewer people, particularly on Mondays and Fridays. Cafés and sandwich shops that depended on office workers have struggled, and some have closed. At the same time, suburbs and smaller towns have experienced a revival, as people spend more time, and money, closer to home."],["A","Housing markets have also been affected. With commuting no longer necessary every day, some workers have moved further away from expensive cities in search of larger homes and gardens. This has pushed up prices in some rural areas, sometimes causing tension with local residents."],["A","So what will happen to empty office buildings? Some cities are experimenting with converting them into apartments, which could help ease housing shortages. However, this is often more complicated than it sounds, since office buildings are typically deep, with limited natural light in the centre and plumbing designed for shared bathrooms."],["A","Ultimately, the cities that adapt most successfully will probably be those that become places people want to visit, not just places they have to go to work."]],
q:[{t:"mc",q:"What is a hybrid model?",o:["Working only from home","Splitting the week between home and the workplace","Working at weekends"],a:1},{t:"mc",q:"On which days are business districts quietest?",o:["Tuesdays and Thursdays","Mondays and Fridays","Wednesdays"],a:1},{t:"mc",q:"What problem has appeared in some rural areas?",o:["Poor internet","Rising house prices","Too many offices"],a:1},{t:"mc",q:"Why is converting offices into flats difficult?",o:["The buildings are too small.","Limited natural light and unsuitable plumbing","The land is too expensive."],a:1}],
gap:"Many companies have adopted [hybrid] models. Suburbs and smaller towns have experienced a [revival]. This could help ease housing [shortages].",
dict:"Some workers have moved further away from expensive cities in search of larger homes."},
{id:"l-b2-3", title:"Can We Trust What We Read Online?", type:"Discussion", speakers:{A:"Host",B:"Mia",C:"Mr Grant"},
lines:[["A","Today we're asking whether young people can tell the difference between real and fake news online. Mia, you're a university student. Where do you get your news?"],["B","Honestly, mostly from social media and short videos. I rarely visit news websites directly. But I think my generation is more sceptical than people assume. We've grown up with the internet, so we know not to believe everything we see."],["C","I'd like to believe that, but research suggests otherwise. Several studies have found that many students struggle to distinguish between sponsored content and genuine news. Being comfortable with technology isn't the same as being able to evaluate information critically."],["B","That's a fair point. I suppose it's easy to share something quickly without checking it, especially when it confirms what you already think."],["A","Mr Grant, should schools be doing more?"],["C","Absolutely. In my school, students learn to check the original source, look at what other reliable outlets are reporting and notice emotional language designed to provoke a reaction. One technique we teach is called lateral reading: instead of staying on a single website, you open new tabs to find out what others say about it."],["B","I wish I'd been taught that at school. I learned most of it by making mistakes, like sharing a story that turned out to be a joke from a satirical website."],["A","Is technology itself part of the solution?"],["C","It can help. Fact-checking tools and warning labels are useful. But no tool can replace human judgement. We need readers who ask questions."]],
q:[{t:"mc",q:"Where does Mia mainly get her news?",o:["Newspapers","Social media and short videos","Television"],a:1},{t:"mc",q:"What does Mr Grant think?",o:["Young people are very good at judging news.","Being comfortable with technology isn't enough.","Schools teach too much about media."],a:1},{t:"mc",q:"What is lateral reading?",o:["Reading slowly","Checking what other sources say about a website","Reading only headlines"],a:1},{t:"mc",q:"What did Mia once share by mistake?",o:["A joke story from a satirical website","A fake advert","A private photo"],a:0}],
gap:"My generation is more [sceptical|skeptical] than people assume. Students notice emotional language designed to [provoke] a reaction. No tool can replace human [judgement|judgment].",
dict:"Being comfortable with technology isn't the same as being able to evaluate information critically."},
{id:"l-b2-4", title:"Learning How to Learn", type:"Talk", speakers:{A:"Speaker"},
lines:[["A","Most of us spend years in education, yet very few of us are ever taught how to learn effectively. In fact, some of the most popular study methods are among the least effective."],["A","Take rereading. Many students read their notes again and again before an exam. It feels productive, because the material becomes familiar. Unfortunately, familiarity is not the same as knowledge. When the exam comes, students often discover that they can recognise information but not recall it."],["A","Research points to two techniques that work much better. The first is retrieval practice: testing yourself instead of simply reviewing. The effort of pulling information out of your memory strengthens it."],["A","The second is spacing. Rather than studying a topic for five hours in one day, it's more effective to spread those hours over several days or weeks. Each time you return to the material, you have forgotten a little, and relearning it makes the memory more durable."],["A","A third useful idea is interleaving, which means mixing different types of problems in one session. It feels harder, and that's precisely the point. Learning that feels difficult is often learning that lasts."]],
q:[{t:"mc",q:"What is the problem with rereading?",o:["It is too slow.","Familiarity is not the same as knowledge.","It makes you tired."],a:1},{t:"mc",q:"Retrieval practice means…",o:["testing yourself","reading again","highlighting notes"],a:0},{t:"mc",q:"Spacing means…",o:["studying everything at once","spreading study over time","studying in a quiet place"],a:1},{t:"mc",q:"Interleaving means…",o:["mixing different types of problems","studying with friends","taking long breaks"],a:0}],
gap:"Familiarity is not the same as [knowledge]. Relearning it makes the memory more [durable]. Learning that feels [difficult|hard] is often learning that lasts.",
dict:"The effort of pulling information out of your memory strengthens it."},
{id:"l-b2-5", title:"Why Do We Sleep?", type:"Interview", speakers:{A:"Host",B:"Dr Patel"},
lines:[["A","Joining me today is Dr Ravi Patel, a sleep scientist. Dr Patel, we spend about a third of our lives asleep. Do we actually know why?"],["B","We know much more than we did twenty years ago, although there are still open questions. One of the clearest findings is that sleep is essential for memory. During deep sleep, the brain appears to replay and strengthen what we learned during the day."],["A","So staying up all night before an exam is a bad idea?"],["B","A very bad idea. Students who stay up all night tend to perform worse than those who study less but sleep properly."],["A","How much sleep do adults really need?"],["B","For most adults, between seven and nine hours. Many people who believe they're fine on five or six hours are simply used to feeling tired."],["A","What are the consequences of not getting enough?"],["B","In the short term, poor concentration, worse mood and slower reaction times, which is why tired driving is so dangerous. Over the long term, chronic lack of sleep has been linked to heart disease and depression, although the relationships are complex."],["A","Any practical advice for our listeners?"],["B","Keep a regular schedule, even at weekends. Make your bedroom dark, cool and quiet, and avoid screens for at least an hour before bed. And if you can't sleep, get up, do something relaxing in dim light, and go back to bed when you feel sleepy."]],
q:[{t:"mc",q:"What does deep sleep help with?",o:["Digestion","Memory","Only muscles"],a:1},{t:"mc",q:"Students who stay up all night before an exam…",o:["perform better","perform worse","perform the same"],a:1},{t:"mc",q:"How much sleep do most adults need?",o:["5–6 hours","7–9 hours","10–12 hours"],a:1},{t:"mc",q:"What should you do if you can't sleep?",o:["Stay in bed and wait","Get up and do something relaxing","Use your phone"],a:1}],
gap:"The brain appears to replay and [strengthen] what we learned. Tired driving is so [dangerous]. Avoid screens for at least an [hour] before bed.",
dict:"Many people who believe they're fine on five or six hours are simply used to feeling tired."}
];
